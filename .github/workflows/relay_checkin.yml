name: relay-checkin

on:
  workflow_dispatch:

jobs:
  checkin:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Send layman check-in (Telegram + email if configured)
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          RELAY_NOTIFY_EMAIL: ${{ secrets.RELAY_NOTIFY_EMAIL }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          python scripts/relay_notify.py approval --message "Relay check-in: automated loop is running. Task 52 merged; task 53 in progress. No GitHub needed. Reply OK in Cursor when you see this."
          python scripts/relay_notify_email.py approval --message "Relay check-in: loop running. Reply OK in Cursor." || true
