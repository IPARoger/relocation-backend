name: cursor-task-trigger

# Runs immediately when a new task file lands on main → launches Cursor cloud agent.
# Email is sent ONLY when a PR is ready for your merge (human gate).

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'tasks/[0-9]*.md'

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: relay-executor
  cancel-in-progress: false

jobs:
  gate:
    runs-on: ubuntu-latest
    outputs:
      number: ${{ steps.task.outputs.number }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Extract task info
        id: task
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            TASK_FILE=$(ls -1 tasks/[0-9]*_*.md 2>/dev/null | sort -t/ -k2 | tail -1 || true)
          else
            TASK_FILE=$(git diff --name-only HEAD~1 HEAD \
              | grep -E '^tasks/[0-9]+_.*\.md$' | head -1 || true)
          fi
          if [ -z "$TASK_FILE" ]; then
            echo "number=" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "number=$(basename "$TASK_FILE" | grep -oE '^[0-9]+')" >> "$GITHUB_OUTPUT"

  execute:
    needs: gate
    if: needs.gate.outputs.number != ''
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install cursor-sdk
        run: pip install cursor-sdk

      - name: Launch Cursor cloud agent
        id: exec
        env:
          CURSOR_API_KEY: ${{ secrets.CURSOR_API_KEY }}
          RELAY_BRANCH: main
        run: |
          set -euo pipefail
          OUT="$(python scripts/relay_executor.py)"
          echo "$OUT"
          echo "exec_out<<EOF" >> "$GITHUB_OUTPUT"
          echo "$OUT" >> "$GITHUB_OUTPUT"
          echo "EOF" >> "$GITHUB_OUTPUT"

      - name: Email — merge PR (only ping when we need you)
        if: startsWith(steps.exec.outputs.exec_out, 'EXECUTED')
        env:
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          RELAY_NOTIFY_EMAIL: ${{ secrets.RELAY_NOTIFY_EMAIL }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python scripts/relay_notify_email.py approval --task "${{ needs.gate.outputs.number }}" \
            --message "Cloud agent finished. Open the PR link below. If it says Draft, click Ready for review then Merge."

      - name: Email — low balance
        if: failure() && contains(steps.exec.outputs.exec_out, 'LOW')
        continue-on-error: true
        env:
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          RELAY_NOTIFY_EMAIL: ${{ secrets.RELAY_NOTIFY_EMAIL }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: python scripts/relay_notify_email.py low-balance
