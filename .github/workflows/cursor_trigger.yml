name: cursor-task-trigger

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'tasks/[0-9]*.md'

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: relay-executor
  cancel-in-progress: false

jobs:
  notify:
    runs-on: ubuntu-latest
    outputs:
      number: ${{ steps.task.outputs.number }}
      file: ${{ steps.task.outputs.file }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Extract task info
        id: task
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            TASK_FILE=$(ls -1 tasks/[0-9]*_*.md 2>/dev/null | sort -t/ -k2 | tail -1 || true)
          else
            TASK_FILE=$(git diff --name-only HEAD~1 HEAD \
              | grep -E '^tasks/[0-9]+_.*\.md$' | head -1 || true)
          fi
          if [ -z "$TASK_FILE" ]; then
            echo "file=" >> "$GITHUB_OUTPUT"
            echo "number=" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          TASK_NUM=$(basename "$TASK_FILE" | grep -oE '^[0-9]+' || true)
          echo "file=$TASK_FILE" >> "$GITHUB_OUTPUT"
          echo "number=$TASK_NUM" >> "$GITHUB_OUTPUT"

      - name: Email — task started
        if: steps.task.outputs.number != ''
        continue-on-error: true
        env:
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          RELAY_NOTIFY_EMAIL: ${{ secrets.RELAY_NOTIFY_EMAIL }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: python scripts/relay_notify_email.py started --task "${{ steps.task.outputs.number }}"

  execute:
    needs: notify
    if: needs.notify.outputs.number != ''
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install cursor-sdk
        run: pip install cursor-sdk

      - name: Launch Cursor cloud agent
        id: exec
        env:
          CURSOR_API_KEY: ${{ secrets.CURSOR_API_KEY }}
          RELAY_BRANCH: main
        run: |
          set -euo pipefail
          OUT="$(python scripts/relay_executor.py)"
          echo "$OUT"
          echo "exec_out<<EOF" >> "$GITHUB_OUTPUT"
          echo "$OUT" >> "$GITHUB_OUTPUT"
          echo "EOF" >> "$GITHUB_OUTPUT"

      - name: Email — approval required (merge PR)
        if: startsWith(steps.exec.outputs.exec_out, 'EXECUTED')
        env:
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          RELAY_NOTIFY_EMAIL: ${{ secrets.RELAY_NOTIFY_EMAIL }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python scripts/relay_notify_email.py approval --task "${{ needs.notify.outputs.number }}"

      - name: Email — low balance
        if: failure() && contains(steps.exec.outputs.exec_out, 'LOW')
        continue-on-error: true
        env:
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          RELAY_NOTIFY_EMAIL: ${{ secrets.RELAY_NOTIFY_EMAIL }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: python scripts/relay_notify_email.py low-balance
