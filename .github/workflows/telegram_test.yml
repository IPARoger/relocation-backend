name: telegram-test

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'scripts/relay_notify.py'
      - '.github/workflows/telegram_test.yml'

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Verify Telegram credentials and send test ping
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python scripts/relay_notify.py --verify
