name: two-agent-relay

# Fast loop: plan next task when a closeout lands on main (results/*.md push).
# Launches cloud agent (non-blocking). relay-automerge.yml merges PRs. Digest every 15 tasks.
# Manual "Run workflow" still available. Weekly schedule is a safety net only.

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Dry run (no paid API calls, no changes)"
        type: boolean
        default: false
      continue_after_digest:
        description: "Clear digest pause and resume planning (after you read the summary)"
        type: boolean
        default: false
  push:
    branches: [main]
    paths:
      - 'results/[0-9]*.md'
  schedule:
    - cron: '0 9 * * 1'   # Monday 09:00 UTC — safety net only

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: relay-planner
  cancel-in-progress: false

jobs:
  relay:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout relay branch
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Continue after digest (manual ack)
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.continue_after_digest == true }}
        run: python scripts/relay_progress.py clear-ack

      - name: Record closeout and send digest if due
        if: ${{ github.event_name == 'push' }}
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_MODEL: gpt-4o-mini
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          RELAY_NOTIFY_EMAIL: ${{ secrets.RELAY_NOTIFY_EMAIL }}
        run: |
          python scripts/relay_progress.py record-closeout
          python scripts/relay_progress.py send-digest-if-due || true

      - name: Commit relay progress
        if: ${{ github.event_name == 'push' }}
        run: |
          git config user.name "relay-bot"
          git config user.email "relay-bot@users.noreply.github.com"
          git add relay/progress.json
          git diff --staged --quiet || git commit -m "relay: progress counter"
          git push origin HEAD:main || true

      - name: Dry-run rehearsal
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run == true }}
        run: |
          python scripts/relay_preflight.py --dry-run
          python scripts/relay_planner.py --dry-run
          python scripts/relay_executor.py --dry-run

      - name: Preflight balance check (cheap)
        id: preflight
        if: ${{ github.event_name != 'workflow_dispatch' || inputs.dry_run == false }}
        continue-on-error: true
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_MODEL: gpt-4o-mini
        run: |
          set +e
          OUT="$(python scripts/relay_preflight.py)"; CODE=$?
          echo "$OUT"
          echo "code=$CODE" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Warn low balance and stop
        continue-on-error: true
        if: ${{ (github.event_name != 'workflow_dispatch' || inputs.dry_run == false) && steps.preflight.outputs.code == '5' }}
        env:
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          RELAY_NOTIFY_EMAIL: ${{ secrets.RELAY_NOTIFY_EMAIL }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          python scripts/relay_notify_email.py low-balance
          exit 1

      - name: Pause for digest acknowledgment
        id: digest_pause
        if: ${{ (github.event_name != 'workflow_dispatch' || inputs.dry_run == false) && steps.preflight.outputs.code == '0' }}
        run: |
          if [ -f relay/progress.json ] && python -c "import json; print(json.load(open('relay/progress.json')).get('awaiting_digest_ack'))" | grep -q True; then
            echo "planner_out=PAUSE: Digest sent — read Telegram summary, then run Actions → two-agent-relay → Continue after digest." >> "$GITHUB_OUTPUT"
          else
            echo "planner_out=" >> "$GITHUB_OUTPUT"
          fi

      - name: Plan next task (GPT brain)
        id: plan
        if: ${{ (github.event_name != 'workflow_dispatch' || inputs.dry_run == false) && steps.preflight.outputs.code == '0' && steps.digest_pause.outputs.planner_out == '' }}
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_MODEL: gpt-4o-mini
        run: |
          OUT="$(python scripts/relay_planner.py)"; echo "$OUT"
          echo "planner_out<<EOF" >> "$GITHUB_OUTPUT"
          echo "$OUT" >> "$GITHUB_OUTPUT"
          echo "EOF" >> "$GITHUB_OUTPUT"

      - name: Commit new task to branch
        if: ${{ (github.event_name != 'workflow_dispatch' || inputs.dry_run == false) && startsWith(steps.plan.outputs.planner_out, 'PLANNED') }}
        run: |
          git config user.name "relay-bot"
          git config user.email "relay-bot@users.noreply.github.com"
          git add tasks/
          git commit -m "relay: plan ${{ steps.plan.outputs.planner_out }}" || echo "nothing to commit"
          git push origin HEAD:main

      - name: Install cursor-sdk
        if: ${{ (github.event_name != 'workflow_dispatch' || inputs.dry_run == false) && startsWith(steps.plan.outputs.planner_out, 'PLANNED') }}
        run: pip install cursor-sdk

      - name: Launch Cursor cloud agent (bot push does not trigger cursor-task-trigger)
        id: exec
        if: ${{ (github.event_name != 'workflow_dispatch' || inputs.dry_run == false) && startsWith(steps.plan.outputs.planner_out, 'PLANNED') }}
        env:
          CURSOR_API_KEY: ${{ secrets.CURSOR_API_KEY }}
          RELAY_BRANCH: main
        run: |
          set -euo pipefail
          OUT="$(python scripts/relay_executor.py)"
          echo "$OUT"
          echo "exec_out<<EOF" >> "$GITHUB_OUTPUT"
          echo "$OUT" >> "$GITHUB_OUTPUT"
          echo "EOF" >> "$GITHUB_OUTPUT"

      - name: Email — human decision needed (planner PAUSE)
        if: ${{ startsWith(steps.plan.outputs.planner_out, 'PAUSE') }}
        continue-on-error: true
        env:
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          RELAY_NOTIFY_EMAIL: ${{ secrets.RELAY_NOTIFY_EMAIL }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          python scripts/relay_notify_email.py approval --message "Planner PAUSE: ${{ steps.plan.outputs.planner_out }}"
