name: two-agent-relay

# Fast loop: plan next task when a closeout lands on main (results/*.md push).
# You are only pinged by email when: PR needs merge, planner PAUSEs, or low balance.
# Manual "Run workflow" still available. Weekly schedule is a safety net only.

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Dry run (no paid API calls, no changes)"
        type: boolean
        default: false
  push:
    branches: [main]
    paths:
      - 'results/[0-9]*.md'
  schedule:
    - cron: '0 9 * * 1'   # Monday 09:00 UTC — safety net only

permissions:
  contents: write
  pull-requests: read

concurrency:
  group: relay-planner
  cancel-in-progress: false

jobs:
  relay:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout relay branch
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Dry-run rehearsal
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run == true }}
        run: |
          python scripts/relay_preflight.py --dry-run
          python scripts/relay_planner.py --dry-run
          python scripts/relay_executor.py --dry-run

      - name: Preflight balance check (cheap)
        id: preflight
        if: ${{ github.event_name != 'workflow_dispatch' || inputs.dry_run == false }}
        continue-on-error: true
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_MODEL: ${{ secrets.OPENAI_MODEL }}
        run: |
          set +e
          OUT="$(python scripts/relay_preflight.py)"; CODE=$?
          echo "$OUT"
          echo "code=$CODE" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Warn low balance and stop
        if: ${{ (github.event_name != 'workflow_dispatch' || inputs.dry_run == false) && steps.preflight.outputs.code == '5' }}
        env:
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          RELAY_NOTIFY_EMAIL: ${{ secrets.RELAY_NOTIFY_EMAIL }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          python scripts/relay_notify_email.py low-balance
          exit 1

      - name: Plan next task (GPT brain)
        id: plan
        if: ${{ (github.event_name != 'workflow_dispatch' || inputs.dry_run == false) && steps.preflight.outputs.code == '0' }}
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_MODEL: ${{ secrets.OPENAI_MODEL }}
        run: |
          OUT="$(python scripts/relay_planner.py)"; echo "$OUT"
          echo "planner_out<<EOF" >> "$GITHUB_OUTPUT"
          echo "$OUT" >> "$GITHUB_OUTPUT"
          echo "EOF" >> "$GITHUB_OUTPUT"

      - name: Commit new task to branch
        if: ${{ (github.event_name != 'workflow_dispatch' || inputs.dry_run == false) && startsWith(steps.plan.outputs.planner_out, 'PLANNED') }}
        run: |
          git config user.name "relay-bot"
          git config user.email "relay-bot@users.noreply.github.com"
          git add tasks/
          git commit -m "relay: plan ${{ steps.plan.outputs.planner_out }}" || echo "nothing to commit"
          git push origin HEAD:main

      - name: Email — human decision needed (planner PAUSE)
        if: ${{ startsWith(steps.plan.outputs.planner_out, 'PAUSE') }}
        env:
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          RELAY_NOTIFY_EMAIL: ${{ secrets.RELAY_NOTIFY_EMAIL }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          python scripts/relay_notify_email.py approval --message "Planner PAUSE: ${{ steps.plan.outputs.planner_out }}"
