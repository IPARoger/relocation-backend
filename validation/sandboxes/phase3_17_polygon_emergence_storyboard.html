<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Phase 3.17 Polygon Emergence Storyboard</title>
  <style>
    :root { color-scheme: dark; --ink: #d7dee8; --muted: #8d9aaa; --line: rgba(148, 163, 184, 0.18); --page: #070b13; }
    html, body { margin: 0; min-height: 100%; background: var(--page); color: var(--ink); font: 13px/1.45 Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
    body { padding: 28px; } header { max-width: 1120px; margin: 0 auto 22px; }
    h1 { margin: 0 0 8px; font-size: 19px; font-weight: 600; letter-spacing: 0.01em; }
    .intro { max-width: 880px; margin: 0; color: var(--muted); }
    .error { display: none; max-width: 840px; margin: 16px auto; padding: 10px 12px; border: 1px solid rgba(248, 113, 113, 0.4); border-radius: 10px; background: rgba(127, 29, 29, 0.22); color: #fecaca; }
    .mode-section { max-width: 1560px; margin: 0 auto 30px; padding: 16px; border: 1px solid var(--line); border-radius: 18px; background: rgba(15, 23, 42, 0.42); }
    .mode-title { display: flex; justify-content: space-between; gap: 16px; align-items: baseline; margin: 0 0 14px; }
    .mode-title h2 { margin: 0; font-size: 14px; font-weight: 650; letter-spacing: 0.05em; text-transform: uppercase; }
    .mode-title span { color: var(--muted); font-size: 12px; }
    .grid { display: grid; grid-template-columns: repeat(4, minmax(260px, 1fr)); gap: 12px; }
    .slide { overflow: hidden; border: 1px solid var(--line); border-radius: 14px; background: #101725; }
    .slide canvas { display: block; width: 100%; height: auto; aspect-ratio: 1.45 / 1; }
    .caption { display: flex; justify-content: space-between; gap: 10px; padding: 8px 10px 10px; border-top: 1px solid var(--line); color: var(--muted); font-size: 11px; }
    .caption strong { color: inherit; font-weight: 650; }
  </style>
</head>
<body>
  <header><h1>Phase 3.17 — Real Pixel-Based Polygon Emergence Storyboard</h1><p class="intro">Dark-mode deterministic solver storyboard. Each act is drawn from explicit real-polygon sampling zones: global probes, boundary bands, occupancy compression, outside virga, and center-out settlement.</p></header>
  <div id="error" class="error" role="alert"></div><main id="storyboard" aria-label="Eight-act dark polygon emergence storyboard"></main>
  <script>
    "use strict";
    const API_BASE = "http://127.0.0.1:8000";
    const REQUEST_BODY = { birth_year: 1976, birth_month: 1, birth_day: 13, birth_hour_utc: 12.78333, house_conditions: [{ planet: "sun", house: 1 }], angle_sign_conditions: [], generation_mode: "contour", resolution: 1.5 };
    const W = 420, H = 290;
    const MODE = { label: "Dark Mode", note: "deterministic raster field solving a real polygon seam", background: "#07101d", grid: "rgba(148, 163, 184, 0.075)", silver: "#cbd5e1", yellow: "#e3b321", blue: "#55bed1", blueDim: "#2f7f98", final: "#d8a11d" };
    const ACTS = [
      { id: 1, title: "Uncertain Field", note: "neutral probes", global: .36, neutralBand: .18, insideBand: 0, outsideBand: 0, bandWidth: 38, compressionWidth: 34, interior: 0, virga: 0, final: false },
      { id: 2, title: "Directional Sensing", note: "weak pressure", global: .30, neutralBand: .42, insideBand: 0, outsideBand: 0, bandWidth: 38, compressionWidth: 32, interior: 0, virga: 0, final: false },
      { id: 3, title: "Local Clustering", note: "silver congealing", global: .20, neutralBand: .70, insideBand: .10, outsideBand: .10, bandWidth: 36, compressionWidth: 30, interior: 0, virga: 0, final: false },
      { id: 4, title: "Border Hunting", note: "identity begins", global: .10, neutralBand: .58, insideBand: .46, outsideBand: .46, bandWidth: 38, compressionWidth: 26, interior: 0, virga: 0, final: false },
      { id: 5, title: "Peak Froth", note: "bilateral over-sampling", global: .03, neutralBand: .28, insideBand: .96, outsideBand: .96, bandWidth: 42, compressionWidth: 24, interior: 0, virga: 0, final: false },
      { id: 6, title: "Occupancy Compression", note: "seam solves", global: 0, neutralBand: .08, insideBand: 1.18, outsideBand: 1.08, bandWidth: 22, compressionWidth: 13, interior: .22, virga: 0, final: false },
      { id: 7, title: "Virga + Rebirth", note: "near-settled certainty", global: 0, neutralBand: 0, insideBand: .62, outsideBand: .38, bandWidth: 16, compressionWidth: 9, interior: .96, virga: .86, final: false },
      { id: 8, title: "Silent Vector Resolution", note: "entropy removed", global: 0, neutralBand: 0, insideBand: 0, outsideBand: 0, bandWidth: 0, compressionWidth: 0, interior: 1, virga: 1, final: true }
    ];
    function showError(text) { const el = document.getElementById("error"); el.textContent = text; el.style.display = "block"; }
    async function fetchRealPolygon() { const res = await fetch(`${API_BASE}/search-regions`, { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(REQUEST_BODY) }); if (!res.ok) throw new Error(`Backend returned ${res.status}`); const geojson = await res.json(); const features = Array.isArray(geojson.features) ? geojson.features : []; const polygons = features.filter(feature => feature?.geometry?.type === "Polygon" && feature?.properties?.planet === "sun" && feature?.properties?.house === 1); if (polygons.length !== 1) throw new Error(`Expected one Sun-in-1 polygon, got ${polygons.length}`); return polygons[0]; }
    function hash01(a, b, c = 0) { const n = Math.sin(a * 12.9898 + b * 78.233 + c * 37.719) * 43758.5453; return n - Math.floor(n); }
    function pointInRing(point, ring) { let inside = false; for (let i = 0, j = ring.length - 1; i < ring.length; j = i++) { const xi = ring[i].x, yi = ring[i].y, xj = ring[j].x, yj = ring[j].y; if (yi > point.y !== yj > point.y) { const ix = ((xj - xi) * (point.y - yi)) / (yj - yi + 1e-15) + xi; if (point.x < ix) inside = !inside; } } return inside; }
    function polygonCentroid(points) { const sum = points.reduce((acc, point) => ({ x: acc.x + point.x, y: acc.y + point.y }), { x: 0, y: 0 }); return { x: sum.x / points.length, y: sum.y / points.length }; }
    function segmentDistance(point, a, b) { const dx = b.x - a.x, dy = b.y - a.y, denom = dx * dx + dy * dy || 1; const t = Math.max(0, Math.min(1, ((point.x - a.x) * dx + (point.y - a.y) * dy) / denom)); return Math.hypot(point.x - (a.x + dx * t), point.y - (a.y + dy * t)); }
    function nearestBoundaryDistance(point, ring) { let best = Infinity; for (let i = 0; i < ring.length - 1; i += 1) best = Math.min(best, segmentDistance(point, ring[i], ring[i + 1])); return best; }
    function buildProjection(ring) { const xs = ring.map(c => c[0]), ys = ring.map(c => c[1]); const minLon = Math.min(...xs), maxLon = Math.max(...xs), minLat = Math.min(...ys), maxLat = Math.max(...ys); const pad = 30; const scale = Math.min((W - pad * 2) / (maxLon - minLon), (H - pad * 2) / (maxLat - minLat)); const projected = ring.map(c => ({ x: pad + (c[0] - minLon) * scale, y: H - pad - (c[1] - minLat) * scale })); return { projected, centroid: polygonCentroid(projected) }; }
    function buildBoundarySamples(ring) { const samples = []; for (let i = 0; i < ring.length - 1; i += 1) { const a = ring[i], b = ring[i + 1]; const dx = b.x - a.x, dy = b.y - a.y, len = Math.hypot(dx, dy); if (len < 1) continue; const stepCount = Math.max(3, Math.floor(len / 3.5)); const normalA = { x: -dy / len, y: dx / len }; const probeA = { x: (a.x + b.x) / 2 + normalA.x * 4, y: (a.y + b.y) / 2 + normalA.y * 4 }; const normal = pointInRing(probeA, ring) ? normalA : { x: -normalA.x, y: -normalA.y }; for (let s = 0; s <= stepCount; s += 1) { const t = (s + .5) / (stepCount + 1); const base = { x: a.x + dx * t, y: a.y + dy * t }; for (let offset = 2; offset <= 42; offset += 4) { samples.push({ x: base.x + normal.x * offset, y: base.y + normal.y * offset, normal, offset, side: "inside", seed: hash01(i, s, offset) }); samples.push({ x: base.x - normal.x * offset, y: base.y - normal.y * offset, normal, offset, side: "outside", seed: hash01(i + 19, s + 3, offset) }); } } } return samples; }
    function drawBackground(ctx) { ctx.fillStyle = MODE.background; ctx.fillRect(0, 0, W, H); ctx.strokeStyle = MODE.grid; ctx.lineWidth = 1; for (let x = 20; x < W; x += 20) { ctx.beginPath(); ctx.moveTo(x + .5, 0); ctx.lineTo(x + .5, H); ctx.stroke(); } for (let y = 20; y < H; y += 20) { ctx.beginPath(); ctx.moveTo(0, y + .5); ctx.lineTo(W, y + .5); ctx.stroke(); } }
    function pathPolygon(ctx, ring) { ctx.beginPath(); ring.forEach((p, i) => { if (i === 0) ctx.moveTo(p.x, p.y); else ctx.lineTo(p.x, p.y); }); ctx.closePath(); }
    function drawCell(ctx, x, y, color, alpha, size = 2) { const sx = Math.round(x / 2) * 2 + .5, sy = Math.round(y / 2) * 2 + .5; ctx.globalAlpha = Math.max(0, Math.min(1, alpha)); ctx.fillStyle = color; ctx.fillRect(sx - size / 2, sy - size / 2, size, size); ctx.globalAlpha = 1; }
    function drawGlobalProbes(ctx, act, centroid) { if (act.global <= 0) return; for (let y = 24; y < H - 24; y += 10) for (let x = 22; x < W - 22; x += 10) { const seed = hash01(x, y, act.id); if (seed > act.global) continue; const dx = (centroid.x - x) * .018 * (act.neutralBand + act.global), dy = (centroid.y - y) * .010 * (act.neutralBand + act.global); drawCell(ctx, x + dx, y + dy, MODE.silver, .30 + act.global * .35, 2); } }
    function drawBoundaryLayer(ctx, act, samples) { samples.forEach(sample => { if (sample.offset > act.bandWidth) return; const sideDensity = sample.side === "inside" ? act.insideBand : act.outsideBand; const pressure = Math.max(0, 1 - sample.offset / Math.max(1, act.bandWidth)); const compression = Math.max(0, 1 - sample.offset / Math.max(1, act.compressionWidth)); const gate = Math.min(1, Math.max(act.neutralBand * pressure, sideDensity * compression)); if (sample.seed > gate) return; const neutral = act.id <= 3 || sample.seed > sideDensity * compression; const color = neutral ? MODE.silver : sample.side === "inside" ? MODE.yellow : MODE.blue; const alpha = neutral ? .24 + act.neutralBand * .50 : Math.min(.94, .34 + sideDensity * .44); const squeeze = act.id >= 6 ? Math.max(0, sample.offset - act.compressionWidth) * .72 : 0; const lateral = act.id <= 5 ? (sample.seed - .5) * Math.max(act.insideBand, act.neutralBand) * 4 : 0; const sign = sample.side === "inside" ? 1 : -1; const x = sample.x - sample.normal.x * squeeze * sign + sample.normal.y * lateral; const y = sample.y - sample.normal.y * squeeze * sign - sample.normal.x * lateral; const size = act.id === 6 ? 4 : act.id >= 5 ? 3 : 2; drawCell(ctx, x, y, color, alpha, size); if (act.id === 5 && sample.seed < .50 && sample.offset <= act.compressionWidth + 12) drawCell(ctx, x + sample.normal.y * 2, y - sample.normal.x * 2, color, alpha * .78, 2); if (act.id === 6 && sample.offset <= act.compressionWidth + 4 && sample.seed < .72) { drawCell(ctx, x + sample.normal.y * 2, y - sample.normal.x * 2, color, alpha * .86, 3); drawCell(ctx, x - sample.normal.y * 2, y + sample.normal.x * 2, color, alpha * .72, 2); } }); }
    function drawInteriorSettlement(ctx, act, ring, centroid) { if (act.interior <= .18) return; const expansion = 42 + act.interior * 235, edgeBuffer = act.id === 7 ? 12 : 0; ctx.save(); pathPolygon(ctx, ring); ctx.clip(); for (let y = 18; y < H - 18; y += 4) for (let x = 18; x < W - 18; x += 4) { const centerDist = Math.hypot(x - centroid.x, y - centroid.y); if (centerDist > expansion) continue; if (edgeBuffer && nearestBoundaryDistance({ x, y }, ring) < edgeBuffer) continue; const gate = Math.min(1, act.interior * Math.max(0, 1 - centerDist / expansion) + (act.id === 7 ? .18 : 0)); if (hash01(x, y, act.id + 50) > gate) continue; drawCell(ctx, x, y, MODE.yellow, .24 + gate * .50, act.id === 7 ? 3 : 4); } ctx.restore(); }
    function drawVirga(ctx, act, samples) { if (act.virga <= 0) return; samples.forEach(sample => { if (sample.side !== "outside" || sample.offset > 24) return; const stagger = Math.max(0, Math.min(1, (act.virga - sample.seed * .55) / .65)); if (stagger <= 0) return; const lift = stagger * (18 + sample.seed * 58), drift = (sample.seed - .5) * 10; drawCell(ctx, sample.x + drift, sample.y - lift, MODE.blueDim, (1 - stagger * .60) * .32, 2); }); }
    function drawFrame(ctx, act, ring, samples, centroid) { drawBackground(ctx); if (act.final) { pathPolygon(ctx, ring); ctx.fillStyle = MODE.final; ctx.globalAlpha = .92; ctx.fill(); ctx.globalAlpha = 1; return; } drawGlobalProbes(ctx, act, centroid); drawBoundaryLayer(ctx, act, samples); drawInteriorSettlement(ctx, act, ring, centroid); drawVirga(ctx, act, samples); ctx.fillStyle = "rgba(215, 222, 232, 0.62)"; ctx.font = "10px ui-monospace, SFMono-Regular, Menlo, Consolas, monospace"; ctx.fillText(`act ${act.id}  ${act.note}`, 12, H - 12); }
    function makeSection(ring, samples, centroid) { const section = document.createElement("section"); section.className = "mode-section dark"; section.innerHTML = `<div class="mode-title"><h2>${MODE.label}</h2><span>${MODE.note}</span></div><div class="grid"></div>`; const grid = section.querySelector(".grid"); ACTS.forEach(act => { const item = document.createElement("article"); item.className = "slide"; const canvas = document.createElement("canvas"); canvas.width = W; canvas.height = H; const caption = document.createElement("div"); caption.className = "caption"; caption.innerHTML = `<strong>${act.id}. ${act.title}</strong><span>${act.final ? "vector resolved" : "solver state"}</span>`; item.append(canvas, caption); grid.append(item); drawFrame(canvas.getContext("2d"), act, ring, samples, centroid); }); return section; }
    async function main() { const feature = await fetchRealPolygon(); const projection = buildProjection(feature.geometry.coordinates[0]); const boundarySamples = buildBoundarySamples(projection.projected); document.getElementById("storyboard").append(makeSection(projection.projected, boundarySamples, projection.centroid)); window.__phase317State = { ok: true, slideCount: ACTS.length, modeCount: 1, activeModes: ["dark"], canvasCount: ACTS.length, boundarySampleCount: boundarySamples.length, source: "POST /search-regions generation_mode=contour", request: REQUEST_BODY, properties: feature.properties, computationalBasis: ["real GeoJSON polygon projection", "act-specific deterministic sampling zones", "side-correct inside/outside boundary bands", "boundary-local peak froth", "compression before vector resolution", "center-out raster settlement", "staggered outside virga", "static storyboard frames"] }; console.info("[phase3.17 storyboard]", window.__phase317State); }
    main().catch(err => { console.error(err); window.__phase317State = { ok: false, error: err.message }; showError(err.message); });
  </script>
</body>
