<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Phase 3.22 Polygon Emergence Animation</title>
  <style>
    :root { color-scheme: dark; --page: #070b13; --panel: #0d1422; --line: rgba(148, 163, 184, 0.18); --ink: #d7dee8; --muted: #8d9aaa; --accent: #d8a11d; }
    html, body { margin: 0; min-height: 100%; background: var(--page); color: var(--ink); font: 13px/1.45 Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
    body { padding: 24px; }
    main { max-width: 1180px; margin: 0 auto; }
    header { margin-bottom: 14px; }
    h1 { margin: 0 0 6px; font-size: 19px; font-weight: 650; }
    p { margin: 0; color: var(--muted); }
    .shell { border: 1px solid var(--line); border-radius: 18px; background: rgba(15, 23, 42, 0.44); padding: 14px; }
    canvas { display: block; width: 100%; height: auto; border: 1px solid var(--line); border-radius: 14px; background: #07101d; }
    .controls { display: grid; grid-template-columns: auto 1fr auto auto auto; gap: 10px; align-items: center; margin-top: 12px; }
    button, label { border: 1px solid var(--line); border-radius: 10px; background: #101827; color: var(--ink); padding: 8px 10px; font: inherit; }
    button { cursor: pointer; }
    input[type="range"] { width: 100%; accent-color: var(--accent); }
    label { display: inline-flex; gap: 7px; align-items: center; color: var(--muted); }
    .readout { min-width: 92px; color: var(--muted); font: 12px/1.3 ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; text-align: right; }
    .error { display: none; margin-top: 12px; color: #fecaca; border: 1px solid rgba(248, 113, 113, 0.4); background: rgba(127, 29, 29, 0.22); border-radius: 10px; padding: 10px 12px; }
  </style>
</head>
<body>
  <main>
    <header>
      <h1>Phase 3.22 — Animated Polygon Emergence Prototype</h1>
      <p>Sandbox-only deterministic solver animation. Real Sun-in-1 polygon, dark mode, occupancy convergence, no production integration.</p>
    </header>
    <section class="shell">
      <canvas id="stage" width="1120" height="680" aria-label="Animated raster occupancy field discovering one real polygon"></canvas>
      <div class="controls">
        <button id="play">Pause</button>
        <input id="scrub" type="range" min="0" max="1" step="0.001" value="0" aria-label="Scrub animation progress" />
        <button id="snapshot">Snapshot</button>
        <label><input id="debugToggle" type="checkbox" checked /> debug</label>
        <div id="readout" class="readout">t=0.000</div>
      </div>
      <div id="error" class="error" role="alert"></div>
    </section>
  </main>

  <script>
    "use strict";

    const API_BASE = "http://127.0.0.1:8000";
    const REQUEST_BODY = {
      birth_year: 1976,
      birth_month: 1,
      birth_day: 13,
      birth_hour_utc: 12.78333,
      house_conditions: [{ planet: "sun", house: 1 }],
      angle_sign_conditions: [],
      generation_mode: "contour",
      resolution: 1.5,
    };
    const W = 1120;
    const H = 680;
    const DURATION_MS = 11000;
    const COLORS = {
      bg: "#07101d",
      grid: "rgba(148, 163, 184, 0.075)",
      silver: "#cbd5e1",
      silverDim: "#8f9bad",
      yellow: "#e3b321",
      yellowPale: "#fff1a6",
      blue: "#55bed1",
      blueDim: "#2f7f98",
      final: "#d8a11d",
      text: "rgba(215, 222, 232, 0.72)",
    };
    const KEYS = [
      { t: 0.00, name: "uncertainty", global: .40, neutralBand: .08, insideBand: 0, outsideBand: 0, bandWidth: 46, compressionWidth: 38, interior: 0, virga: 0, final: 0 },
      { t: 0.18, name: "sensing", global: .36, neutralBand: .30, insideBand: 0, outsideBand: 0, bandWidth: 48, compressionWidth: 36, interior: 0, virga: 0, final: 0 },
      { t: 0.34, name: "gathering", global: .24, neutralBand: .62, insideBand: .06, outsideBand: .06, bandWidth: 46, compressionWidth: 34, interior: 0, virga: 0, final: 0 },
      { t: 0.48, name: "identity", global: .10, neutralBand: .52, insideBand: .42, outsideBand: .42, bandWidth: 44, compressionWidth: 28, interior: 0, virga: 0, final: 0 },
      { t: 0.62, name: "peak froth", global: .03, neutralBand: .24, insideBand: 1.02, outsideBand: 1.02, bandWidth: 50, compressionWidth: 25, interior: 0, virga: 0, final: 0 },
      { t: 0.72, name: "compression", global: 0, neutralBand: .08, insideBand: 1.34, outsideBand: 1.24, bandWidth: 24, compressionWidth: 10, interior: .18, virga: 0, final: 0 },
      { t: 0.91, name: "cooling", global: 0, neutralBand: 0, insideBand: .64, outsideBand: .42, bandWidth: 18, compressionWidth: 9, interior: .96, virga: .88, final: 0 },
      { t: 1.00, name: "silence", global: 0, neutralBand: 0, insideBand: 0, outsideBand: 0, bandWidth: 0, compressionWidth: 0, interior: 1, virga: 1, final: 1 },
    ];

    const canvas = document.getElementById("stage");
    const ctx = canvas.getContext("2d");
    const playButton = document.getElementById("play");
    const scrub = document.getElementById("scrub");
    const snapshot = document.getElementById("snapshot");
    const debugToggle = document.getElementById("debugToggle");
    const readout = document.getElementById("readout");
    const errorEl = document.getElementById("error");

    let running = true;
    let startedAt = performance.now();
    let pausedT = 0;
    let model = null;

    function showError(text) {
      errorEl.textContent = text;
      errorEl.style.display = "block";
    }

    async function fetchRealPolygon() {
      const res = await fetch(`${API_BASE}/search-regions`, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify(REQUEST_BODY),
      });
      if (!res.ok) throw new Error(`Backend returned ${res.status}`);
      const geojson = await res.json();
      const polygons = (Array.isArray(geojson.features) ? geojson.features : []).filter(
        feature =>
          feature?.geometry?.type === "Polygon" &&
          feature?.properties?.planet === "sun" &&
          feature?.properties?.house === 1
      );
      if (polygons.length !== 1) throw new Error(`Expected one Sun-in-1 polygon, got ${polygons.length}`);
      return polygons[0];
    }

    function hash01(a, b, c = 0) {
      const n = Math.sin(a * 12.9898 + b * 78.233 + c * 37.719) * 43758.5453;
      return n - Math.floor(n);
    }

    function smoothstep(x) {
      const t = Math.max(0, Math.min(1, x));
      return t * t * (3 - 2 * t);
    }

    function lerp(a, b, t) {
      return a + (b - a) * t;
    }

    function stateAt(progress) {
      for (let i = 0; i < KEYS.length - 1; i += 1) {
        const a = KEYS[i];
        const b = KEYS[i + 1];
        if (progress >= a.t && progress <= b.t) {
          const u = smoothstep((progress - a.t) / (b.t - a.t));
          return {
            name: u < 0.5 ? a.name : b.name,
            progress,
            global: lerp(a.global, b.global, u),
            neutralBand: lerp(a.neutralBand, b.neutralBand, u),
            insideBand: lerp(a.insideBand, b.insideBand, u),
            outsideBand: lerp(a.outsideBand, b.outsideBand, u),
            bandWidth: lerp(a.bandWidth, b.bandWidth, u),
            compressionWidth: lerp(a.compressionWidth, b.compressionWidth, u),
            interior: lerp(a.interior, b.interior, u),
            virga: lerp(a.virga, b.virga, u),
            final: lerp(a.final, b.final, u),
          };
        }
      }
      return KEYS[KEYS.length - 1];
    }

    function pointInRing(point, ring) {
      let inside = false;
      for (let i = 0, j = ring.length - 1; i < ring.length; j = i++) {
        const xi = ring[i].x;
        const yi = ring[i].y;
        const xj = ring[j].x;
        const yj = ring[j].y;
        if (yi > point.y !== yj > point.y) {
          const ix = ((xj - xi) * (point.y - yi)) / (yj - yi + 1e-15) + xi;
          if (point.x < ix) inside = !inside;
        }
      }
      return inside;
    }

    function polygonCentroid(points) {
      const sum = points.reduce((acc, point) => {
        acc.x += point.x;
        acc.y += point.y;
        return acc;
      }, { x: 0, y: 0 });
      return { x: sum.x / points.length, y: sum.y / points.length };
    }

    function segmentDistance(point, a, b) {
      const dx = b.x - a.x;
      const dy = b.y - a.y;
      const denom = dx * dx + dy * dy || 1;
      const t = Math.max(0, Math.min(1, ((point.x - a.x) * dx + (point.y - a.y) * dy) / denom));
      return Math.hypot(point.x - (a.x + dx * t), point.y - (a.y + dy * t));
    }

    function nearestBoundaryProjection(point, ring) {
      let best = { distance: Infinity, x: ring[0].x, y: ring[0].y };
      for (let i = 0; i < ring.length - 1; i += 1) {
        const a = ring[i];
        const b = ring[i + 1];
        const dx = b.x - a.x;
        const dy = b.y - a.y;
        const denom = dx * dx + dy * dy || 1;
        const t = Math.max(0, Math.min(1, ((point.x - a.x) * dx + (point.y - a.y) * dy) / denom));
        const x = a.x + dx * t;
        const y = a.y + dy * t;
        const distance = Math.hypot(point.x - x, point.y - y);
        if (distance < best.distance) best = { distance, x, y };
      }
      return best;
    }

    function nearestBoundaryDistance(point, ring) {
      let best = Infinity;
      for (let i = 0; i < ring.length - 1; i += 1) {
        best = Math.min(best, segmentDistance(point, ring[i], ring[i + 1]));
      }
      return best;
    }

    function buildProjection(ring) {
      const xs = ring.map(coord => coord[0]);
      const ys = ring.map(coord => coord[1]);
      const minLon = Math.min(...xs);
      const maxLon = Math.max(...xs);
      const minLat = Math.min(...ys);
      const maxLat = Math.max(...ys);
      const pad = 72;
      const scale = Math.min((W - pad * 2) / (maxLon - minLon), (H - pad * 2) / (maxLat - minLat));
      const projected = ring.map(coord => ({
        x: pad + (coord[0] - minLon) * scale,
        y: H - pad - (coord[1] - minLat) * scale,
      }));
      return { projected, centroid: polygonCentroid(projected) };
    }

    function buildSettlementSeeds(ring, centroid) {
      const candidates = [
        { x: centroid.x, y: centroid.y },
        { x: centroid.x - 52, y: centroid.y - 18 },
        { x: centroid.x + 46, y: centroid.y + 22 },
        { x: centroid.x - 18, y: centroid.y + 56 },
        { x: centroid.x + 12, y: centroid.y - 62 },
        { x: centroid.x + 76, y: centroid.y - 30 },
        { x: centroid.x - 78, y: centroid.y + 26 },
      ];
      return candidates
        .filter(point => pointInRing(point, ring))
        .map((point, index) => ({ ...point, seed: hash01(point.x, point.y, index + 83) }));
    }

    function buildFieldProbes(ring, centroid) {
      const probes = [];
      for (let y = 50; y < H - 50; y += 13) {
        for (let x = 50; x < W - 50; x += 13) {
          const seed = hash01(x, y, 401);
          if (seed > 0.58) continue;
          const start = {
            x: x + (hash01(y, x, 402) - 0.5) * 8,
            y: y + (hash01(x, y, 403) - 0.5) * 8,
          };
          const nearest = nearestBoundaryProjection(start, ring);
          const inside = pointInRing(start, ring);
          let nx = start.x - nearest.x;
          let ny = start.y - nearest.y;
          const len = Math.hypot(nx, ny) || 1;
          nx /= len;
          ny /= len;
          const boundaryOffset = 7 + hash01(x, y, 404) * 34;
          const settlementTarget = {
            x: centroid.x + (start.x - centroid.x) * 0.34 + (hash01(x, y, 405) - 0.5) * 34,
            y: centroid.y + (start.y - centroid.y) * 0.34 + (hash01(y, x, 406) - 0.5) * 34,
          };
          probes.push({
            start,
            inside,
            seed,
            wakeSeed: hash01(x, y, 407),
            lingerSeed: hash01(x, y, 408),
            phase: hash01(x, y, 409),
            boundary: {
              x: nearest.x + nx * boundaryOffset,
              y: nearest.y + ny * boundaryOffset,
              nx,
              ny,
              distance: nearest.distance,
              offset: boundaryOffset,
            },
            settlementTarget,
          });
        }
      }
      return probes;
    }

    function drawBackground() {
      ctx.fillStyle = COLORS.bg;
      ctx.fillRect(0, 0, W, H);
      ctx.strokeStyle = COLORS.grid;
      ctx.lineWidth = 1;
      for (let x = 40; x < W; x += 40) {
        ctx.beginPath();
        ctx.moveTo(x + 0.5, 0);
        ctx.lineTo(x + 0.5, H);
        ctx.stroke();
      }
      drawDormantField();
      for (let y = 40; y < H; y += 40) {
        ctx.beginPath();
        ctx.moveTo(0, y + 0.5);
        ctx.lineTo(W, y + 0.5);
        ctx.stroke();
      }
    }

    function drawDormantField() {
      for (let y = 50; y < H - 50; y += 18) {
        for (let x = 50; x < W - 50; x += 18) {
          const seed = hash01(x, y, 101);
          if (seed > 0.36) continue;
          drawCell(x + (seed - 0.5) * 2, y + (hash01(y, x, 102) - 0.5) * 2, COLORS.silverDim, 0.10 + seed * 0.10, 1);
        }
      }
    }

    function pathPolygon(ring) {
      ctx.beginPath();
      ring.forEach((point, index) => {
        if (index === 0) ctx.moveTo(point.x, point.y);
        else ctx.lineTo(point.x, point.y);
      });
      ctx.closePath();
    }

    function drawCell(x, y, color, alpha, size = 2) {
      const sx = Math.round(x / 2) * 2 + 0.5;
      const sy = Math.round(y / 2) * 2 + 0.5;
      ctx.globalAlpha = Math.max(0, Math.min(1, alpha));
      ctx.fillStyle = color;
      ctx.fillRect(sx - size / 2, sy - size / 2, size, size);
      ctx.globalAlpha = 1;
    }

    function drawGlobalProbes(state, centroid) {
      if (state.global <= 0) return;
      for (let y = 64; y < H - 64; y += 14) {
        for (let x = 64; x < W - 64; x += 14) {
          const seed = hash01(x, y, 7);
          if (seed > state.global) continue;
          const wake = smoothstep((state.progress - seed * 0.34) / 0.42);
          const dx = (centroid.x - x) * 0.018 * (state.neutralBand + state.global) * wake;
          const dy = (centroid.y - y) * 0.010 * (state.neutralBand + state.global) * wake;
          const swirl = (hash01(y, x, 103) - 0.5) * 7 * wake * (1 - state.progress);
          drawCell(x + dx + swirl, y + dy - swirl * 0.5, COLORS.silver, 0.18 + wake * 0.34 + state.global * 0.20, 2);
        }
      }
    }

    function drawFieldProbes(state, probes) {
      probes.forEach(probe => {
        const wake = smoothstep((state.progress - (0.04 + probe.wakeSeed * 0.42)) / 0.46);
        const search = smoothstep((state.progress - (0.14 + probe.wakeSeed * 0.20)) / 0.36);
        const identity = smoothstep((state.progress - (0.44 + probe.seed * 0.10)) / 0.18);
        const froth = smoothstep((state.progress - 0.48) / 0.16) * (1 - smoothstep((state.progress - 0.70) / 0.12));
        const compression = smoothstep((state.progress - 0.63) / 0.12) * (1 - smoothstep((state.progress - 0.84) / 0.12));
        const cooling = smoothstep((state.progress - 0.76) / 0.16);
        const finalizing = smoothstep((state.progress - 0.91) / 0.09);

        const boundaryPull = Math.min(1, search * 0.58 + froth * 0.34 + compression * 0.84);
        const seamWidth = 34 * (1 - compression) + 8 * compression;
        const sideSign = probe.inside ? 1 : -1;
        const seamTarget = {
          x: probe.boundary.x - probe.boundary.nx * Math.max(0, probe.boundary.offset - seamWidth) * sideSign,
          y: probe.boundary.y - probe.boundary.ny * Math.max(0, probe.boundary.offset - seamWidth) * sideSign,
        };
        const falseStart = (probe.phase - 0.5) * 18 * (1 - Math.min(1, state.progress / 0.48)) * wake;
        const turbulence = Math.sin((probe.phase + state.progress * 1.7) * Math.PI * 2) * froth * 9;
        let x = lerp(probe.start.x, seamTarget.x, boundaryPull) + probe.boundary.ny * (falseStart + turbulence);
        let y = lerp(probe.start.y, seamTarget.y, boundaryPull) - probe.boundary.nx * (falseStart + turbulence);

        if (probe.inside && cooling > 0) {
          const settleWake = smoothstep((state.progress - (0.72 + probe.lingerSeed * 0.10)) / 0.22);
          x = lerp(x, probe.settlementTarget.x, settleWake * cooling);
          y = lerp(y, probe.settlementTarget.y, settleWake * cooling);
        }

        let alpha = 0.10 + wake * 0.32 + froth * 0.20 + compression * 0.22;
        let size = compression > 0.55 ? 4 : froth > 0.30 ? 3 : 2;
        let color = COLORS.silver;

        if (identity > 0.52) color = probe.inside ? COLORS.yellow : COLORS.blue;

        if (!probe.inside && cooling > 0) {
          const lift = cooling * (18 + probe.lingerSeed * 94);
          const drift = (probe.phase - 0.5) * 34 * cooling;
          x += drift;
          y -= lift;
          color = COLORS.blueDim;
          alpha *= Math.max(0, 1 - cooling * (0.40 + probe.lingerSeed * 0.46));
          size = probe.lingerSeed > 0.72 ? 3 : 2;
        }

        if (finalizing > 0) alpha *= 1 - finalizing;
        if (alpha <= 0.02) return;
        drawCell(x, y, color, alpha, size);
        if (compression > 0.42 && probe.seed < 0.38) drawCell(x + 2, y - 2, color, alpha * 0.72, Math.max(2, size - 1));
      });
    }

    function drawInteriorSettlement(state, ring, centroid, settlementSeeds) {
      if (state.interior <= 0.18) return;
      const expansion = 36 + state.interior * 210;
      const edgeBuffer = state.virga > 0 ? 18 - state.interior * 6 : 0;
      ctx.save();
      pathPolygon(ring);
      ctx.clip();
      for (let y = 54; y < H - 54; y += 5) {
        for (let x = 54; x < W - 54; x += 5) {
          const jx = (hash01(x, y, 301) - 0.5) * 5.2;
          const jy = (hash01(y, x, 302) - 0.5) * 5.2;
          const px = x + jx;
          const py = y + jy;
          let island = 0;
          settlementSeeds.forEach(seed => {
            const d = Math.hypot(px - seed.x, py - seed.y);
            const localWake = smoothstep((state.interior - seed.seed * 0.28) / 0.70);
            const lobe = Math.max(0, 1 - d / expansion);
            island = Math.max(island, lobe * lobe * localWake);
          });
          if (island <= 0) continue;
          if (!pointInRing({ x: px, y: py }, ring)) continue;
          if (edgeBuffer && nearestBoundaryDistance({ x: px, y: py }, ring) < edgeBuffer) continue;
          const gate = Math.min(1, state.interior * island + (state.virga > 0 ? 0.18 : 0));
          if (hash01(x, y, 51) > gate) continue;
          drawCell(px, py, COLORS.yellow, 0.22 + gate * 0.50, state.virga > 0 ? 3 : 4);
        }
      }
      ctx.restore();
    }

    function drawFinal(finalAlpha, ring) {
      if (finalAlpha <= 0) return;
      pathPolygon(ring);
      ctx.fillStyle = COLORS.final;
      ctx.globalAlpha = finalAlpha * 0.92;
      ctx.fill();
      ctx.globalAlpha = 1;
    }

    function render(progress) {
      if (!model) return;
      const state = stateAt(progress);
      drawBackground();
      if (state.final < 1) {
        drawFieldProbes(state, model.probes);
        drawInteriorSettlement(state, model.ring, model.centroid, model.settlementSeeds);
      }
      drawFinal(state.final, model.ring);
      if (debugToggle.checked) {
        ctx.fillStyle = COLORS.text;
        ctx.font = "13px ui-monospace, SFMono-Regular, Menlo, Consolas, monospace";
        ctx.fillText(`t=${progress.toFixed(3)}  ${state.name}`, 18, 24);
        ctx.fillText(`band=${state.bandWidth.toFixed(1)} compression=${state.compressionWidth.toFixed(1)} interior=${state.interior.toFixed(2)} virga=${state.virga.toFixed(2)}`, 18, 44);
      }
      scrub.value = String(progress);
      readout.textContent = `t=${progress.toFixed(3)}`;
      window.__phase322State = {
        ok: true,
        t: progress,
        stateName: state.name,
        canvasCount: 1,
        probeCount: model.probes.length,
        source: "POST /search-regions generation_mode=contour",
        request: REQUEST_BODY,
        properties: model.properties,
      };
    }

    function tick(now) {
      if (running) {
        const progress = Math.min(1, (now - startedAt) / DURATION_MS);
        render(progress);
        if (progress >= 1) {
          running = false;
          pausedT = 1;
          playButton.textContent = "Play";
        }
      }
      requestAnimationFrame(tick);
    }

    playButton.addEventListener("click", () => {
      running = !running;
      playButton.textContent = running ? "Pause" : "Play";
      if (running) startedAt = performance.now() - pausedT * DURATION_MS;
      else pausedT = Number(scrub.value);
    });

    scrub.addEventListener("input", () => {
      pausedT = Number(scrub.value);
      running = false;
      playButton.textContent = "Play";
      render(pausedT);
    });

    snapshot.addEventListener("click", () => {
      const a = document.createElement("a");
      a.download = `phase3_22_polygon_emergence_${Number(scrub.value).toFixed(3)}.png`;
      a.href = canvas.toDataURL("image/png");
      a.click();
    });

    async function main() {
      const feature = await fetchRealPolygon();
      const projection = buildProjection(feature.geometry.coordinates[0]);
      model = {
        ring: projection.projected,
        centroid: projection.centroid,
        probes: buildFieldProbes(projection.projected, projection.centroid),
        settlementSeeds: buildSettlementSeeds(projection.projected, projection.centroid),
        properties: feature.properties,
      };
      render(0);
      requestAnimationFrame(tick);
    }

    main().catch(err => {
      console.error(err);
      window.__phase322State = { ok: false, error: err.message };
      showError(err.message);
    });
  </script>
</body>
</html>
