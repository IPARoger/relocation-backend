<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>First popup — Relocation (mockup)</title>
<link rel="stylesheet" href="fe-mockup-shared.css"/>
</head>
<body class="rm-instrument-surface fe-explore">
<span class="fe-mockup-badge">BI-0B · Mockup 7</span>
<div class="fe-map-page" style="opacity:.4;pointer-events:none">
  <div class="fe-map-canvas"></div>
  <div class="fe-nameplate">Anna Rivera ▾</div>
</div>
<div class="fe-popup-wrap">
  <div class="leaflet-popup-content-wrapper popup-chart-shell">
    <div class="popup-chart">
      <div class="popup-title">Paris, Île-de-France, France</div>
      <p class="popup-coords">Lat 48.8566 · Lon 2.3522</p>
      <hr class="popup-hr-tight"/>
      <div class="popup-angles-summary">
        <span><span class="pa-lbl">ASC</span><span class="pa-val">Leo 12.6°</span></span>
        <span><span class="pa-lbl">MC</span><span class="pa-val">Taurus 8.2°</span></span>
      </div>
      <table class="popup-planet-table">
        <thead>
          <tr>
            <th scope="col" class="col-planet">Planet</th>
            <th scope="col" class="col-house">House</th>
          </tr>
        </thead>
        <tbody>
          <tr><td class="col-planet">Sun</td><td class="col-house">9</td></tr>
          <tr><td class="col-planet">Moon</td><td class="col-house">3</td></tr>
          <tr><td class="col-planet">Mercury</td><td class="col-house">9</td></tr>
          <tr><td class="col-planet">Venus</td><td class="col-house">8</td></tr>
          <tr><td class="col-planet">Mars</td><td class="col-house">11</td></tr>
        </tbody>
      </table>
      <div class="popup-actions">
        <button type="button">View relocated chart</button>
        <button type="button">Favorite</button>
        <button type="button" class="popup-action-view-overlays">View overlays here</button>
      </div>
    </div>
  </div>
</div>
</body>
</html>
