<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>Sign in — Relocation (mockup)</title>
<link rel="stylesheet" href="fe-mockup-shared.css"/>
</head>
<body class="rm-instrument-surface">
<span class="fe-mockup-badge">BI-0B · Mockup 1</span>
<div class="fe-center">
  <div class="fe-journey">
    <p class="fe-wordmark">Relocation</p>
    <p class="fe-purpose">Your personal relocation instrument begins here.</p>
    <div class="fe-card">
      <h1>Welcome back</h1>
      <p class="fe-sub">Sign in to continue to your map.</p>
      <button type="button" class="fe-btn-oauth">Continue with Google</button>
      <p class="fe-divider">or</p>
      <div class="fe-field">
        <label class="fe-label" for="email">Email</label>
        <input class="fe-input" id="email" type="email" placeholder="you@example.com" autocomplete="email"/>
      </div>
      <div class="fe-field">
        <label class="fe-label" for="pw">Password</label>
        <div class="fe-input-wrap">
          <input class="fe-input has-toggle" id="pw" type="password" placeholder="Your password" autocomplete="current-password"/>
          <button type="button" class="fe-pw-toggle" aria-label="Show password">Show</button>
        </div>
      </div>
      <button type="button" class="fe-btn-primary">Sign in</button>
      <div class="fe-link-row">
        <button class="fe-link" type="button">Forgot password?</button>
        <button class="fe-link" type="button">Create account</button>
      </div>
    </div>
  </div>
</div>
</body>
</html>
