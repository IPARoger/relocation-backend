<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>First personalized map — Relocation (mockup)</title>
<link rel="stylesheet" href="fe-mockup-shared.css"/>
</head>
<body class="rm-instrument-surface fe-explore">
<span class="fe-mockup-badge">BI-0B · Mockup 6</span>
<div class="fe-map-page">
  <header class="fe-topbar">
    <div class="fe-brand">Relocation</div>
    <span class="fe-topnav"><strong>Map</strong> · Profile · Comparison · Settings</span>
  </header>
  <div class="fe-map-canvas" aria-label="Map with Sun in 1st overlay (illustrative)"></div>
  <div class="fe-nameplate">Anna Rivera ▾</div>
  <div class="fe-citysearch">
    <div class="fe-sls-wrap"><input class="fe-sls-input" placeholder="Search city or place…" aria-label="City search"/></div>
  </div>
  <div class="fe-mapctrls" aria-label="Map controls">+ − ○ · ‹ Back · Forward · Pin</div>
  <aside class="fe-panel" aria-hidden="true">
    <div class="fe-gv-builder">
      <p class="fe-gv-label">Genie builder</p>
      <div class="fe-gv-chip"><span class="fe-gv-sw"></span> Sun in 1st</div>
      <div class="fe-gv-dd"><span>Planet in house</span><span>▾</span></div>
      <button type="button" class="fe-btn-primary" style="margin-top:10px">Search Map</button>
    </div>
  </aside>
  <div class="fe-bottle" title="Reopen Genie builder">⎈</div>
  <div class="fe-ghost" aria-label="Ghost strip">
    Sun · 1st
    <div class="fe-ghost-controls"><span>M</span><span>S</span></div>
  </div>
  <div class="fe-save-disk" title="Save investigation" aria-label="Save investigation">💾</div>
</div>
</body>
</html>
