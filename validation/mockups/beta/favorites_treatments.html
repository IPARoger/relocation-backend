<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Favorites — color + type treatments</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#2a2d33;font-family:"Avenir Next",-apple-system,sans-serif;color:#23252b}

/* ---- treatment shells ---- */
.tw{font-family:var(--body)}
.tw-banner{background:#1f2127;color:#e8e6e2;font-size:12px;letter-spacing:.06em;padding:11px 28px;font-weight:600}
.tw-inner{background:var(--paper);color:var(--ink);padding:0 0 40px}

/* theme variables */
.theme-a{
  --paper:#ffffff; --card:#ffffff; --ink:#23252b; --soft:#7b8089; --line:#e7e4df;
  --accent:#e8694f; --accent2:#2fa39c; --warm:#f0a93a;
  --head:"Avenir Next","Helvetica Neue",sans-serif; --body:"Avenir Next","Helvetica Neue",sans-serif;
  --natal:#cf7a36; --current:#2fa39c;
}
.theme-b{
  --paper:#fffaf2; --card:#fffefb; --ink:#33302b; --soft:#867a6c; --line:#eee2cf;
  --accent:#df8a3c; --accent2:#a85d77; --warm:#e0a93c;
  --head:"Optima","Gill Sans","Avenir Next",sans-serif; --body:"Avenir Next","Helvetica Neue",sans-serif;
  --natal:#c98a2e; --current:#a85d77;
}
.theme-c{
  --paper:#f5f6fb; --card:#ffffff; --ink:#22253a; --soft:#6c7188; --line:#e6e8f2;
  --accent:#5b6ee0; --accent2:#27b1a0; --warm:#efb13c;
  --head:"Futura","Avenir Next",sans-serif; --body:"Avenir Next","Helvetica Neue",sans-serif;
  --natal:#7a6bd8; --current:#27b1a0;
}

/* nav + context */
.lnav{height:50px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:18px;padding:0 28px;background:var(--card)}
.llogo{font-family:var(--head);font-weight:700;font-size:15px;color:var(--ink)}
.llinks{margin-left:auto;font-size:13px;color:var(--soft)}
.llinks b{color:var(--ink)}
.lctx{padding:22px 28px 16px}
.lname{font-family:var(--head);font-size:22px;font-weight:700;color:var(--ink)}
.lsub{font-size:12px;color:var(--soft);margin-top:4px}

.grid3{display:grid;grid-template-columns:2fr 1fr 1fr;gap:30px;padding:6px 28px 0;align-items:start}

.sec-head{display:flex;align-items:center;margin-bottom:9px}
.sec-title{font-family:var(--head);font-size:18px;font-weight:700;color:var(--ink)}
.sec-tools{display:flex;align-items:center;gap:8px;margin-bottom:6px;flex-wrap:wrap}
.list-search{position:relative;flex:1 1 auto;min-width:0}
.list-search input{width:100%;font-family:var(--body);font-size:12px;color:var(--ink);background:var(--card);border:1px solid var(--line);border-radius:9px;padding:7px 10px 7px 28px;outline:none}
.list-search input::placeholder{color:var(--soft)}
.list-search input:focus{border-color:var(--accent)}
.list-search .si{position:absolute;left:9px;top:50%;transform:translateY(-50%);color:var(--soft);line-height:0}
.list-search .si svg{width:13px;height:13px}
.sortsel{font-family:var(--body);font-size:12px;color:var(--soft);background:var(--card);border:1px solid var(--line);border-radius:9px;padding:7px 8px;outline:none;cursor:pointer;-webkit-appearance:none;appearance:none}

.compare-bar{padding:6px 2px}
.compare-btn{font-family:var(--body);font-size:12.5px;font-weight:700;color:#fff;background:var(--accent);border:none;border-radius:9px;padding:8px 18px;cursor:pointer;transition:.12s;box-shadow:0 6px 16px -8px color-mix(in srgb,var(--accent) 80%,transparent)}
.compare-btn[disabled]{background:transparent;color:var(--soft);border:1px dashed var(--line);box-shadow:none;cursor:default}

.fav-list,.mini-list{border-top:1px solid var(--line)}
.fav-row{display:grid;grid-template-columns:22px 200px 92px auto 1fr;align-items:center;column-gap:12px;
  padding:12px 6px;border-bottom:1px solid var(--line);cursor:pointer;border-radius:8px;transition:background .12s}
.fav-row:hover{background:color-mix(in srgb,var(--accent) 7%,transparent)}
.chk{width:16px;height:16px;border:1.5px solid var(--line);border-radius:5px;background:var(--card);display:inline-flex;align-items:center;justify-content:center;transition:.12s}
.fav-row.sel .chk{background:var(--accent);border-color:var(--accent);color:#fff}
.chk svg{width:10px;height:10px;opacity:0}.fav-row.sel .chk svg{opacity:1}
.fav-loc{font-family:var(--head);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.fav-loc .city{font-weight:700;font-size:15.5px;color:var(--ink)}
.fav-loc .country{font-weight:400;font-size:15.5px;color:var(--ink)}
.fav-badge{display:flex}
.mk{font-family:var(--body);font-size:8.5px;letter-spacing:.08em;text-transform:uppercase;font-weight:700;padding:2.5px 8px;border-radius:999px;white-space:nowrap}
.mk.natal{color:#fff;background:var(--natal)}
.mk.current{color:#fff;background:var(--current)}
.fav-acts{display:flex;align-items:center;gap:8px}
.open-chart{border:none;background:none;cursor:pointer;padding:2px;color:var(--line);line-height:0;display:inline-flex;transition:.14s}
.fav-row:hover .open-chart{color:var(--accent);transform:translateX(3px)}
.open-chart svg{width:18px;height:18px}
.star{font-size:15px;color:var(--line);cursor:pointer;transition:.12s;line-height:1}
.star.on{color:var(--warm)}
.fav-row:hover .star{color:var(--soft)}.fav-row:hover .star.on{color:var(--warm)}
.icon-btn{border:none;background:none;cursor:pointer;color:var(--soft);padding:3px;border-radius:6px;display:inline-flex;transition:.12s;line-height:0}
.icon-btn:hover{color:var(--ink);background:color-mix(in srgb,var(--ink) 8%,transparent)}
.icon-btn svg{width:15px;height:15px}
.note-dot.has{color:var(--warm)}

.mini-row{display:grid;grid-template-columns:1fr auto auto auto;align-items:center;column-gap:8px;padding:10px 6px;border-bottom:1px solid var(--line);cursor:pointer;border-radius:8px;transition:background .12s}
.mini-row:hover{background:color-mix(in srgb,var(--accent) 7%,transparent)}
.mini-main{min-width:0}
.mini-title{font-family:var(--head);font-size:13.5px;font-weight:700;color:var(--ink);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mini-sub{font-size:11px;color:var(--soft);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.open-link{font-size:11.5px;font-weight:600;color:var(--accent);white-space:nowrap}

.list-foot{display:flex;align-items:center;gap:9px;padding:9px 2px 0;font-size:11px;color:var(--soft)}
.list-foot .pg{border:1px solid var(--line);background:var(--card);color:var(--soft);width:24px;height:24px;border-radius:7px;cursor:pointer;display:inline-flex;align-items:center;justify-content:center}
.list-foot .pg[disabled]{opacity:.4;cursor:default}
</style>
</head>
<body>
<div id="root"></div>

<script>
const SI = '<span class="si"><svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="2"><circle cx="9" cy="9" r="6"/><path d="M14 14l4 4"/></svg></span>';
const CHK = '<span class="chk"><svg viewBox="0 0 12 12"><path d="M1 6l3.2 3.5L11 2" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg></span>';
const NOTEBTN = (has)=>'<button class="icon-btn note-dot'+(has?' has':'')+'" title="Note"><svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M4 3h12v10l-3 4H4z"/><path d="M9 8h6M9 11h4"/></svg></button>';
const CHEV = '<button class="open-chart" title="Open relocated chart"><svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.9"><path d="M7 4l6 6-6 6"/></svg></button>';
const STAR = (on)=>'<span class="star'+(on?' on':'')+'" title="Priority (optional)">&#9733;</span>';
const FOOT = (label)=>'<div class="list-foot"><button class="pg" disabled>&lsaquo;</button><span>'+label+'</span><button class="pg" disabled>&rsaquo;</button></div>';

const cities=[
  {city:"Lisbon",country:"Portugal",mk:"natal",star:true,note:1},
  {city:"Austin",country:"Texas, USA",mk:"current",star:false,note:0},
  {city:"Kyoto",country:"Japan",mk:"",star:true,note:1},
  {city:"Bali",country:"Indonesia",mk:"",star:false,note:0},
  {city:"Barcelona",country:"Spain",mk:"",star:false,note:1},
  {city:"Mexico City",country:"Mexico",mk:"",star:false,note:0},
  {city:"Cape Town",country:"South Africa",mk:"",star:true,note:0},
  {city:"Reykjav\u00edk",country:"Iceland",mk:"",star:false,note:0},
];
const comparisons=[
  {t:"Professional \u00b7 Europe / N. Africa",s:"Lisbon \u00b7 Barcelona \u00b7 Marrakesh",star:true,note:1},
  {t:"Lisbon \u00b7 New York \u00b7 Austin",s:"Updated 3 days ago \u00b7 3 cities",star:false,note:0},
  {t:"Pacific options",s:"Kyoto \u00b7 Bali \u00b7 Honolulu",star:false,note:1},
];
const searches=[
  {t:"Sun in 1st \u00b7 Venus in 2nd",s:"No Saturn in 1st",star:true,note:1},
  {t:"Strong MC \u00b7 Water ASC",s:"Jupiter angular",star:false,note:0},
  {t:"Saved 12 May",s:"Mars not in 7th \u00b7 benefic angles",star:false,note:0},
];

function favRow(c){
  return `<div class="fav-row">
    ${CHK}
    <div class="fav-loc"><span class="city">${c.city}</span><span class="country">, ${c.country}</span></div>
    <div class="fav-badge">${c.mk?`<span class="mk ${c.mk}">${c.mk}</span>`:''}</div>
    <div class="fav-acts">${CHEV}${STAR(c.star)}${NOTEBTN(c.note)}</div>
    <span></span>
  </div>`;
}
function miniRow(m,open){
  return `<div class="mini-row">
    <div class="mini-main"><div class="mini-title">${m.t}</div><div class="mini-sub">${m.s}</div></div>
    ${STAR(m.star)}${NOTEBTN(m.note)}<span class="open-link">${open}</span>
  </div>`;
}

const themes=[
  {k:'a',label:'TREATMENT A — Bright & Airy · white · coral + teal · Avenir'},
  {k:'b',label:'TREATMENT B — Warm Sunrise · soft cream-white · amber + plum · Optima / Gill Sans'},
  {k:'c',label:'TREATMENT C — Modern Calm · cool white · indigo + mint · Futura'},
];

function block(t){
  const s=t.k;
  return `<section class="tw theme-${s}">
    <div class="tw-banner">${t.label}</div>
    <div class="tw-inner">
      <nav class="lnav"><span class="llogo">Relocation</span><span class="llinks">Map &nbsp;&middot;&nbsp; <b>Profile</b> &nbsp;&middot;&nbsp; Compare &nbsp;&middot;&nbsp; Settings</span></nav>
      <div class="lctx"><div class="lname">David Goodman</div><div class="lsub">\u2026 Planet in House \u00b7 Aspect in Sign \u00b7 Angle-to-Angle tables sit above \u2026</div></div>
      <div class="grid3">
        <section>
          <div class="sec-head"><div class="sec-title">Favorites</div></div>
          <div class="sec-tools">
            ${searchBox('Add a city\u2026')}
            ${sortSel(true)}
          </div>
          <div class="compare-bar"><button class="compare-btn cbtn" disabled>Compare</button></div>
          <div class="fav-list" id="fav-${s}"></div>
          <div class="compare-bar"><button class="compare-btn cbtn" disabled>Compare</button></div>
          ${FOOT('1\u20138 of 8')}
        </section>
        <section>
          <div class="sec-head"><div class="sec-title">Saved Comparisons</div></div>
          <div class="sec-tools">${searchBox('Search by city\u2026')}${sortSel(false)}</div>
          <div class="mini-list" id="cmp-${s}"></div>
          ${FOOT('1\u20133 of 3')}
        </section>
        <section>
          <div class="sec-head"><div class="sec-title">Saved Searches</div></div>
          <div class="sec-tools">${searchBox('Search variable / note\u2026')}${sortSel(false)}</div>
          <div class="mini-list" id="srch-${s}"></div>
          ${FOOT('1\u20133 of 3')}
        </section>
      </div>
    </div>
  </section>`;
}
function searchBox(ph){return `<div class="list-search">${SI}<input placeholder="${ph}"></div>`;}
function sortSel(prox){return `<select class="sortsel"><option>Recent</option><option>A\u2013Z</option><option>Starred</option>${prox?'<option>Proximity</option>':''}</select>`;}

document.getElementById('root').innerHTML = themes.map(block).join('');
themes.forEach(t=>{
  const s=t.k;
  document.getElementById('fav-'+s).innerHTML  = cities.map(favRow).join('');
  document.getElementById('cmp-'+s).innerHTML  = comparisons.map(m=>miniRow(m,'Open')).join('');
  document.getElementById('srch-'+s).innerHTML = searches.map(m=>miniRow(m,'Open')).join('');
});

/* interactions */
document.querySelectorAll('.fav-list').forEach(list=>{
  const sec=list.closest('section');
  const btns=sec.querySelectorAll('.cbtn');
  list.querySelectorAll('.fav-row').forEach(row=>row.addEventListener('click',e=>{
    if(e.target.closest('.open-chart')||e.target.closest('.note-dot')||e.target.closest('.star'))return;
    const n=list.querySelectorAll('.fav-row.sel').length;
    if(!row.classList.contains('sel')&&n>=5)return;
    row.classList.toggle('sel');
    const sel=list.querySelectorAll('.fav-row.sel').length;
    btns.forEach(b=>{b.disabled=sel<2;b.textContent=sel>=2?`Compare (${sel})`:'Compare';});
  }));
});
document.querySelectorAll('.star').forEach(s=>s.addEventListener('click',e=>{e.stopPropagation();s.classList.toggle('on');}));
</script>
</body>
</html>
