<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="1960" viewBox="0 0 1440 1960">
  <defs>
    <style>
      .serif { font-family: Georgia, "Times New Roman", serif; }
      .sans { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
      .nav { font-size: 15px; letter-spacing: 0.02em; }
      .eyebrow { font-size: 12px; letter-spacing: 0.14em; text-transform: uppercase; }
      .label { font-size: 13px; letter-spacing: 0.04em; text-transform: uppercase; }
      .small { font-size: 13px; }
      .body { font-size: 16px; }
      .title { font-size: 46px; }
      .section { font-size: 25px; }
      .chart-title { font-size: 30px; }
    </style>

    <radialGradient id="paperGlow" cx="50%" cy="20%" r="80%">
      <stop offset="0%" stop-color="#fbfaf5"/>
      <stop offset="100%" stop-color="#ebe7dc"/>
    </radialGradient>

    <filter id="softShadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="18" stdDeviation="28" flood-color="#1c1a16" flood-opacity="0.10"/>
    </filter>

    <filter id="quietShadow" x="-8%" y="-8%" width="116%" height="124%">
      <feDropShadow dx="0" dy="10" stdDeviation="18" flood-color="#1c1a16" flood-opacity="0.06"/>
    </filter>
  </defs>

  <rect width="1440" height="1960" fill="url(#paperGlow)"/>

