<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Profile Workspace — v09</title>

<!--
  ============================================================
  prototype_profile_workspace_v09.html
  ============================================================
  Pass 2 — "make it sing".

  Fixes / changes (per notes):
  - COMPARISON wheel no longer cut: the plate now sits ABOVE the
    wheel (upper-left) in both single & comparison, so the wheel
    gets full width. Single chart may be larger than the dual.
  - Click-to-enlarge is explicit on every wheel (⤢ Enlarge, always
    visible; the whole disc is clickable).
  - A2A: the PLANET column is PERMANENT; only the aspect VALUES
    slide (true photo-carousel). Box size is constant between a
    single angle and "All". Planets bold only in "All" (+ angle
    titles bold there too).
  - Comparison keeps PiH and A2A SIDE BY SIDE (not stacked), just
    slightly more compact; tables hug so numbers aren't far away.
  - Comparison tables are 50/50; natal primacy is shown subtly via
    a warm interior tint (guest = cool), not size.
  - Name row: prominent dropdown caret; Add is a "+" next to Edit.
  - Slower, human-paced motion. Comparison chart unfolds from the
    page centerline (the "drawer" inside natal), much slower.
  - Tables warmed: rounded, soft non-SaaS border, home/guest tint,
    larger & friendlier type.
  - Background leans harder into the leaflet map palette (water-blue
    / leaf-green / warm land) so the page relates to the map.
  - Saved section gets real separation (cards) and bigger, warmer,
    more inviting titles.

  Parked: real geometry, comparison PAGE, genie/style coordination,
  remaining wheel tuning, final palette lock.
  ============================================================
-->

<style>
  :root {
    --ink:#2c2823; --ink-soft:#5e584d; --ink-faint:#938c7e;
    --line:#e6e0d4; --line-soft:#efeae0;
    --paper:#f0ece3; --card:#fbf9f3;
    --accent:#5b6b63; --gold:#b89a55; --teal:#5f8a90; --water:#7ba3bd; --leaf:#8aa873;
    --serif:"Iowan Old Style","Palatino Linotype",Palatino,"Book Antiqua",Georgia,serif;
    --sans:"Avenir Next","Segoe UI",-apple-system,BlinkMacSystemFont,Helvetica,Arial,sans-serif;
    --arh:28px;
  }
  * { box-sizing:border-box; }
  html, body { margin:0; padding:0; color:var(--ink); font-family:var(--sans);
    font-size:15.5px; line-height:1.45; overflow-x:hidden;
    background:
      radial-gradient(58% 48% at 8% -2%, rgba(123,163,189,.20), transparent 58%),
      radial-gradient(52% 44% at 99% 8%, rgba(138,168,115,.16), transparent 58%),
      radial-gradient(85% 70% at 50% 113%, rgba(123,163,189,.13), transparent 60%),
      radial-gradient(120% 90% at 50% -8%, rgba(184,154,85,.06), transparent 55%),
      var(--paper); background-attachment:fixed; }
  .wrap { max-width:1240px; margin:0 auto; padding:0 28px 80px; }

  /* header */
  .topbar { display:flex; align-items:center; justify-content:space-between; gap:24px; padding:18px 0 12px; }
  .brand { font-family:var(--serif); font-size:19px; font-weight:600; flex:0 0 auto; }
  .mainmenu { display:flex; gap:2px; flex:1 1 auto; justify-content:center; flex-wrap:wrap; }
  .mainmenu a { font-size:14px; color:var(--ink-soft); text-decoration:none; padding:6px 11px; border-radius:8px; }
  .mainmenu a:hover { background:rgba(184,154,85,.12); color:var(--ink); }
  .account { position:relative; flex:0 0 auto; }
  .account-btn { display:flex; align-items:center; gap:8px; font-size:14px; color:var(--ink-soft);
    background:transparent; border:1px solid transparent; border-radius:8px; padding:7px 10px; cursor:pointer; }
  .account-btn:hover { background:rgba(184,154,85,.12); }
  .account-btn .chev { color:var(--ink-faint); font-size:11px; }
  .account .menu { position:absolute; right:0; top:calc(100% + 6px); min-width:180px; background:var(--card);
    border:1px solid var(--line); border-radius:12px; padding:6px; display:none; z-index:20; box-shadow:0 8px 24px rgba(44,40,35,.14); }
  .account.open .menu { display:block; }
  .account .menu a { display:block; font-size:14px; color:var(--ink-soft); text-decoration:none; padding:8px 10px; border-radius:7px; }
  .account .menu a:hover { background:var(--line-soft); color:var(--ink); }

  button,.btn { font:inherit; font-size:13px; color:var(--ink-soft); background:var(--card);
    border:1px solid var(--line); border-radius:8px; padding:6px 10px; cursor:pointer;
    transition:border-color .15s ease, background .15s ease, color .15s ease; }
  button:hover,.btn:hover { border-color:var(--ink-faint); }

  /* view pills */
  .view-pills { display:inline-flex; gap:4px; padding:4px; margin:8px 0 28px;
    background:rgba(184,154,85,.10); border:1px solid var(--line); border-radius:999px; }
  .view-pills .chip { font-size:14px; padding:8px 22px; border:none; background:transparent; color:var(--ink-soft); border-radius:999px; cursor:pointer; }
  .view-pills .chip.on { background:var(--card); color:var(--ink); font-weight:600; box-shadow:0 1px 3px rgba(44,40,35,.12); }

  /* charts */
  .charts { display:grid; gap:34px; align-items:start; }
  .charts.single { grid-template-columns:1fr; max-width:860px; }
  .charts.sxs { grid-template-columns:1fr 1fr; }
  @media (max-width:920px){ .charts.sxs{ grid-template-columns:1fr; } }

  .chart-head { display:flex; flex-direction:column; gap:14px; margin-bottom:18px; }
  .plate { font-size:12.5px; line-height:1.5; }
  .plate .name-row { display:flex; align-items:center; gap:10px; margin-bottom:5px; flex-wrap:wrap; }
  .profile-select { font-family:var(--serif); font-size:19px; font-weight:600; color:var(--ink);
    background:transparent; border:none; padding:0; cursor:pointer; display:inline-flex; align-items:center; gap:8px; }
  .profile-select .caret { font-size:13px; color:var(--ink); width:20px; height:20px; border-radius:50%;
    background:rgba(184,154,85,.18); display:inline-flex; align-items:center; justify-content:center; }
  .name-tools { display:inline-flex; align-items:center; gap:4px; }
  .name-tools .linkbtn { background:transparent; border:none; color:var(--ink-faint); padding:2px 6px; font-size:12.5px; cursor:pointer; }
  .name-tools .linkbtn.plus { font-size:16px; line-height:1; padding:0 6px; }
  .name-tools .linkbtn:hover { color:var(--accent); }
  .plate .primary { color:var(--ink); }
  .plate .sub { color:var(--ink-faint); }
  .plate .gap { height:7px; }
  .reloc-block { margin-top:9px; padding-top:8px; border-top:1px solid var(--line-soft); }
  .reloc-block.bare { margin:0; padding:0; border:none; }
  .reloc-block .reloc { font-size:10.5px; text-transform:uppercase; letter-spacing:.11em; color:var(--ink-faint); }
  .reloc-block .big { font-family:var(--serif); font-size:17px; font-weight:600; color:var(--ink); margin:1px 0 2px; }

  .wheel-wrap { display:flex; justify-content:center; }
  .disc { position:relative; border-radius:50%; overflow:hidden; cursor:zoom-in;
    box-shadow: 0 0 30px 1px rgba(184,154,85,.14), 0 3px 12px rgba(44,40,35,.14), inset 0 0 0 1px rgba(44,40,35,.05); }
  .disc.home  { box-shadow: 0 0 34px 2px rgba(184,154,85,.18), 0 3px 12px rgba(44,40,35,.14), inset 0 0 0 1px rgba(44,40,35,.05); }
  .disc.guest { box-shadow: 0 0 34px 2px rgba(95,138,144,.17), 0 3px 12px rgba(44,40,35,.14), inset 0 0 0 1px rgba(44,40,35,.05); }
  .charts.single .disc { width:560px; max-width:100%; }
  .charts.sxs .disc { width:470px; max-width:100%; }
  .disc svg { display:block; width:100%; height:auto; }
  .popout { position:absolute; top:12px; right:12px; padding:4px 9px; border-radius:8px; font-size:11.5px;
    background:rgba(251,249,243,.9); border:1px solid var(--line); color:var(--ink-soft);
    display:inline-flex; align-items:center; gap:5px; pointer-events:none; box-shadow:0 1px 3px rgba(44,40,35,.12); }

  /* reference tables — warmed, less boxy */
  .ref-row { display:grid; grid-template-columns:1fr 1fr; gap:20px; align-items:start; }
  @media (max-width:560px){ .ref-row{ grid-template-columns:1fr; } }
  .tcard { position:relative; background:var(--card); border-radius:16px; padding:6px 8px 12px;
    border:1px solid rgba(184,154,85,.22);
    box-shadow:0 1px 2px rgba(44,40,35,.06), 0 10px 24px -16px rgba(44,40,35,.3); }
  .tcard.home  { border-color:rgba(184,154,85,.30); background:linear-gradient(180deg, rgba(184,154,85,.07), rgba(184,154,85,0) 46%), var(--card); }
  .tcard.guest { border-color:rgba(95,138,144,.28); background:linear-gradient(180deg, rgba(95,138,144,.07), rgba(95,138,144,0) 46%), var(--card); }
  .tcard h3 { font-family:var(--serif); font-size:15.5px; font-weight:600; margin:0; padding:12px 14px 6px; }
  .tcard h3 .deco { display:block; height:2px; width:26px; margin-top:6px; border-radius:2px;
    background:linear-gradient(90deg, var(--gold), transparent); }
  .tcard.guest h3 .deco { background:linear-gradient(90deg, var(--teal), transparent); }
  .subhead { font-family:var(--serif); font-size:13px; color:var(--ink-soft); padding:10px 14px 3px; }
  table { width:auto; border-collapse:collapse; }
  .rt td,.rt th { text-align:left; padding:3px 14px; font-size:13.5px; line-height:1.5; white-space:nowrap; }
  .rt th { font-weight:500; color:var(--ink-faint); font-size:10.5px; text-transform:uppercase; letter-spacing:.05em; padding-bottom:5px; }
  .rt td.pl { color:var(--ink-soft); padding-right:34px; }
  .rt td.hs { color:var(--ink); font-weight:600; }
  .rt td.angle-name { color:var(--ink-soft); font-weight:600; padding-right:24px; }
  .rt .asp { color:var(--ink); }
  .rt .orb { font-size:11.5px; color:var(--ink-faint); margin-left:8px; }
  .rt .dim { color:var(--line); }

  /* A2A: fixed planet column + sliding value columns */
  .a2a-top { padding:11px 14px 8px; }
  .apills { display:flex; gap:5px; flex-wrap:wrap; }
  .apill { font-size:12.5px; padding:5px 14px; border:1px solid var(--line); background:var(--card);
    color:var(--ink-soft); border-radius:999px; cursor:pointer; transition:all .15s ease; }
  .apill.on { background:var(--accent); color:#fff; border-color:var(--accent); }
  .a2a-rows { display:flex; }
  .a2a-planetcol { flex:0 0 100px; }
  .a2a-viewport { flex:1 1 auto; overflow:hidden; }
  .a2a-track { display:flex; width:400%; transition:transform .78s cubic-bezier(.33,.12,.18,1); }
  .a2a-track .vcol { width:25%; flex:0 0 25%; }
  .a2a-allcols { flex:1 1 auto; display:flex; }
  .a2a-allcols .vcol { flex:1 1 0; }
  .ar { height:var(--arh); display:flex; align-items:center; padding:0 14px; font-size:13.5px; color:var(--ink); white-space:nowrap; }
  .ar.pl { color:var(--ink-soft); }
  .ar.pl.b { color:var(--ink); font-weight:600; }
  .ar.head { height:22px; font-size:10.5px; color:transparent; }
  .ar.vh { font-family:var(--serif); font-size:12px; font-weight:600; color:var(--ink-soft); }

  /* compact comparison */
  .charts.sxs .rt td,.charts.sxs .rt th { font-size:12px; padding:2px 11px; }
  .charts.sxs .rt td.pl { padding-right:24px; }
  .charts.sxs .ar { height:24px; font-size:12px; padding:0 11px; }
  .charts.sxs .a2a-planetcol { flex-basis:84px; }
  .charts.sxs .tcard h3 { font-size:14px; }

  /* motion */
  @keyframes slideInRight { from{ transform:translateX(34px); opacity:0; } to{ transform:none; opacity:1; } }
  @keyframes slideInLeft  { from{ transform:translateX(-34px); opacity:0; } to{ transform:none; opacity:1; } }
  @keyframes unfold { from{ transform:scaleX(.015); opacity:0; } 30%{ opacity:.6; } to{ transform:none; opacity:1; } }
  .slin-r { animation: slideInRight .58s cubic-bezier(.22,.61,.36,1) both; }
  .slin-l { animation: slideInLeft  .58s cubic-bezier(.22,.61,.36,1) both; }
  .unfold { animation: unfold .92s cubic-bezier(.22,.7,.3,1) .12s both; transform-origin:left center; }

  /* saved section — cards with separation + friendly titles */
  .lower { margin-top:50px; padding-top:30px; border-top:1px solid var(--line);
    display:grid; grid-template-columns:1.5fr 1fr 1fr; gap:22px; align-items:start; }
  @media (max-width:920px){ .lower{ grid-template-columns:1fr; } }
  .panel { background:var(--card); border:1px solid rgba(184,154,85,.20); border-radius:16px; padding:20px 20px 16px;
    box-shadow:0 1px 2px rgba(44,40,35,.06), 0 12px 26px -18px rgba(44,40,35,.3); }
  .panel h3 { font-family:var(--serif); font-size:17px; font-weight:600; color:var(--ink); margin:0 0 14px; }
  .compare-btn { margin-bottom:12px; opacity:.45; pointer-events:none; }
  .compare-btn.active { opacity:1; pointer-events:auto; background:var(--accent); color:#fff; border-color:var(--accent); }
  .fav { list-style:none; margin:0; padding:0; }
  .fav li { display:flex; align-items:center; gap:10px; padding:6px 0; }
  .fav input[type=checkbox] { width:15px; height:15px; flex:0 0 auto; accent-color:var(--accent); }
  .fav .star { color:var(--ink-faint); cursor:pointer; font-size:15px; flex:0 0 auto; }
  .fav .star.on { color:var(--gold); }
  .fav .city { flex:1 1 auto; display:inline-flex; align-items:center; gap:6px; cursor:pointer;
    padding:6px 10px; margin:-6px -10px; border-radius:9px; transition:background .15s ease, color .15s ease; }
  .fav .city .name { font-size:14px; color:var(--ink); }
  .fav .city .go { color:var(--ink-faint); font-size:15px; margin-left:auto; }
  .fav .city:hover { background:rgba(184,154,85,.12); }
  .fav .city:hover .go { color:var(--gold); }
  .list { list-style:none; margin:0; padding:0; }
  .list li { display:flex; align-items:baseline; justify-content:space-between; gap:10px; padding:9px 0; border-top:1px solid var(--line-soft); font-size:13.5px; }
  .list li:first-child { border-top:none; }
  .list .meta { font-size:12px; color:var(--ink-faint); white-space:nowrap; }
  .notes-link { font-size:11.5px; color:var(--ink-faint); text-decoration:none; border-bottom:1px dotted var(--line); margin-left:8px; }
  .notes-link:hover { color:var(--ink-soft); }

  /* modal */
  .modal-back { position:fixed; inset:0; background:rgba(40,36,31,.38); display:none; align-items:center; justify-content:center; z-index:50; padding:24px; }
  .modal-back.open { display:flex; }
  .modal { background:var(--card); border:1px solid var(--line); border-radius:16px; max-width:760px; width:100%;
    max-height:92vh; overflow:auto; padding:26px; box-shadow:0 18px 50px rgba(44,40,35,.26); }
  .modal h2 { font-family:var(--serif); font-size:19px; margin:0 0 16px; }
  .modal .close { float:right; }
</style>
</head>
<body>
<div class="wrap">

  <header class="topbar">
    <div class="brand">Relocation</div>
    <nav class="mainmenu">
      <a href="#">View Map</a><a href="#">Profile</a><a href="#">Comparison</a>
      <a href="#">Transit Lab</a><a href="#">Store</a><a href="#">Help</a><a href="#">Settings</a>
    </nav>
    <div class="account" id="account">
      <button class="account-btn" id="accountBtn">David Goodman <span class="chev">▾</span></button>
      <div class="menu"><a href="#">Account</a><a href="#">Billing</a><a href="#">Sign out</a></div>
    </div>
  </header>

  <div class="view-pills" id="viewPills">
    <button class="chip on" data-view="natal">Natal</button>
    <button class="chip" data-view="current">Current Location</button>
    <button class="chip" data-view="comparison">Comparison</button>
  </div>

  <div class="charts single" id="charts"></div>

  <div class="lower" id="lower"></div>
</div>

<div class="modal-back" id="modalBack"><div class="modal" id="modal"></div></div>

<script>
  (function(){
    var acct=document.getElementById('account'), btn=document.getElementById('accountBtn');
    btn.addEventListener('click',function(e){e.stopPropagation();acct.classList.toggle('open');});
    document.addEventListener('click',function(){acct.classList.remove('open');});
  })();

  /* ============ WHEEL (from chart-wheel v09) ============ */
  var GREY={ink:'#2b2926', cusp:'#8a857a', divider:'#9b968b', tick5:'#c4bfb2', innerSoft:'#9a9485'};
  var WHEEL_PLANETS=[
    {t:'Su',a:200},{t:'Mo',a:95},{t:'Me',a:213},{t:'Ve',a:165},{t:'Ma',a:300},{t:'Ju',a:40},
    {t:'Sa',a:340},{t:'Ur',a:128},{t:'Ne',a:74},{t:'Pl',a:255},{t:'Ch',a:18}
  ];
  var WHEEL_ASPECTS=[
    ['Su','Mo','soft'],['Su','Ma','hard'],['Su','Ju','soft'],['Mo','Ve','soft'],['Mo','Pl','hard'],
    ['Me','Ve','soft'],['Me','Ma','hard'],['Ve','Sa','soft'],['Ma','Pl','hard'],['Ju','Sa','hard'],
    ['Ur','Ne','soft'],['Ne','Pl','soft'],['Su','Sa','minor'],['Me','Ne','minor']
  ];
  var WHEEL_CUSPS=[180,146,118,84,56,24,0,326,298,264,236,204];
  var ASPCOL={hard:'#a8392c', soft:'#3d6b86', minor:'#9a7a3a'};

  function wglyph(t){ switch(t){
    case 'Su': return '<circle cx="0" cy="0" r="3.4"/><circle cx="0" cy="0" r="0.8" fill="currentColor"/>';
    case 'Mo': return '<path d="M1.7,-3.7 A3.8,3.8 0 1 0 1.7,3.7 A2.6,3.8 0 1 1 1.7,-3.7 Z" fill="currentColor" stroke="none"/>';
    case 'Me': return '<circle cx="0" cy="0" r="2"/><path d="M-2,-3.8 A2,2 0 0 0 2,-3.8"/><line x1="0" y1="2" x2="0" y2="4.7"/><line x1="-1.5" y1="3.4" x2="1.5" y2="3.4"/>';
    case 'Ve': return '<circle cx="0" cy="-1.1" r="2.1"/><line x1="0" y1="1" x2="0" y2="4.7"/><line x1="-1.6" y1="2.9" x2="1.6" y2="2.9"/>';
    case 'Ma': return '<circle cx="-1.1" cy="1.3" r="2.3"/><line x1="0.7" y1="-0.6" x2="3.9" y2="-3.8"/><line x1="3.9" y1="-3.8" x2="2.0" y2="-3.8"/><line x1="3.9" y1="-3.8" x2="3.9" y2="-1.9"/>';
    case 'Ju': return '<path d="M-3.2,-2.4 C-3.2,-4.5 0.2,-4.5 0.2,-1 L0.2,4.5"/><line x1="-1.5" y1="1.5" x2="3.4" y2="1.5"/>';
    case 'Sa': return '<path d="M-2.8,-3 C-1,-4.3 1.7,-3.6 1.7,-0.8 C1.7,2.4 0,4.5 -2.4,4.5"/><line x1="-3.6" y1="-1.3" x2="0.2" y2="-1.3"/>';
    case 'Ur': return '<line x1="0" y1="-4.1" x2="0" y2="2.4"/><line x1="-2.8" y1="-1.5" x2="2.8" y2="-1.5"/><line x1="-2.8" y1="-3.2" x2="-2.8" y2="0"/><line x1="2.8" y1="-3.2" x2="2.8" y2="0"/><circle cx="0" cy="3.6" r="1.1"/>';
    case 'Ne': return '<line x1="0" y1="-2.4" x2="0" y2="4.5"/><path d="M-3.2,-3.2 L-3.2,0.4 M3.2,-3.2 L3.2,0.4 M-3.2,0.2 Q0,3.2 3.2,0.2"/><line x1="-1.7" y1="2.6" x2="1.7" y2="2.6"/>';
    case 'Pl': return '<circle cx="0" cy="-1.5" r="1.4"/><path d="M-2,4.5 L-2,-2.8 L0.1,-2.8"/>';
    case 'Ch': return '<circle cx="0" cy="3.2" r="1.7"/><line x1="0" y1="1.5" x2="0" y2="-4.3"/><line x1="0" y1="-2.1" x2="2.6" y2="-4.5"/><line x1="0" y1="-2.1" x2="2.6" y2="0"/>';
  } return ''; }
  function wsign(i){ switch(i){
    case 0:  return '<path d="M-3,2.5 C-3,-3 -0.6,-3 0,0 C0.6,-3 3,-3 3,2.5"/>';
    case 1:  return '<circle cx="0" cy="1.4" r="2.4"/><path d="M-3.4,-3.2 A3 3 0 0 0 3.4,-3.2"/>';
    case 2:  return '<line x1="-2.6" y1="-3" x2="2.6" y2="-3"/><line x1="-2.6" y1="3" x2="2.6" y2="3"/><line x1="-1.4" y1="-3" x2="-1.4" y2="3"/><line x1="1.4" y1="-3" x2="1.4" y2="3"/>';
    case 3:  return '<circle cx="-1.4" cy="-1.2" r="1.3"/><circle cx="1.4" cy="1.2" r="1.3"/><path d="M-2.7,-1.2 A3 3 0 0 1 1.4,-2.6"/><path d="M2.7,1.2 A3 3 0 0 1 -1.4,2.6"/>';
    case 4:  return '<circle cx="-1.2" cy="1.4" r="1.8"/><path d="M0.4,2 C0.4,-2 -1,-3.5 1.4,-3.5 C3,-3.5 3,-1.4 2.2,-0.6"/>';
    case 5:  return '<path d="M-3.4,-2.5 L-3.4,2.5 M-3.4,-2.5 C-2,-3.4 -1,-2.6 -1,-1 L-1,2.5 M-1,-1 C-1,-3 0.6,-3.4 1.2,-1 L1.2,2.5 M1.2,1 C1.2,3.2 3,3 3.2,1.4"/>';
    case 6:  return '<path d="M-3.4,2.4 L3.4,2.4 M-2.6,0 A2.6 2.6 0 0 1 2.6,0 L-2.6,0"/>';
    case 7:  return '<path d="M-3.4,-2.5 L-3.4,2.5 M-3.4,-2.5 C-2,-3.4 -1,-2.6 -1,-1 L-1,2.5 M-1,-1 C-1,-3 0.6,-3.4 1.2,-1 L1.2,3.4"/><path d="M1.2,1 L3.4,3.4 M3.4,1.2 L3.4,3.4 L1.6,3.4"/>';

  var wuid=0;
  function buildWheel(S, rot){
    wuid++; var c=S/2, k=S/480, id=wuid, R=rot||0;
    var Rclip=0.5*S, Rout=0.41*S, Rzod=0.345*S, Rsg=0.378*S, Rplanet=0.308*S,
        Raring=0.27*S, Rcore=0.072*S, Rnum=0.135*S;
    var base='#eae8e3', band='#f1ece0', glow={color:'#b89a55',alpha:0.16,reach:0.20};
    function pt(a,r){var rad=(a+R)*Math.PI/180;return [c+r*Math.cos(rad), c-r*Math.sin(rad)];}
    function ln(a,r1,r2,col,w){var p1=pt(a,r1),p2=pt(a,r2);
      return '<line x1="'+p1[0].toFixed(2)+'" y1="'+p1[1].toFixed(2)+'" x2="'+p2[0].toFixed(2)+'" y2="'+p2[1].toFixed(2)+'" stroke="'+col+'" stroke-width="'+(w*k).toFixed(2)+'"/>';}
    function cir(r,col,w){return '<circle cx="'+c+'" cy="'+c+'" r="'+r.toFixed(2)+'" fill="none" stroke="'+col+'" stroke-width="'+(w*k).toFixed(2)+'"/>';}
    function wedgeEven(a1,a2,rO,rI,fill){var pts=[],a;
      for(a=a1;a<=a2;a+=3){var p=pt(a,rO);pts.push(p[0].toFixed(1)+','+p[1].toFixed(1));}
      for(a=a2;a>=a1;a-=3){var q=pt(a,rI);pts.push(q[0].toFixed(1)+','+q[1].toFixed(1));}
      return '<polygon points="'+pts.join(' ')+'" fill="'+fill+'" stroke="none"/>';}
    function wedgeCusp(a1,a2,rO,rI,fill){var aa2=(a2<a1)?a2:a2-360,pts=[],a;
      for(a=a1;a>=aa2;a-=3){var p=pt(a,rO);pts.push(p[0].toFixed(1)+','+p[1].toFixed(1));}
      for(a=aa2;a<=a1;a+=3){var q=pt(a,rI);pts.push(q[0].toFixed(1)+','+q[1].toFixed(1));}
      return '<polygon points="'+pts.join(' ')+'" fill="'+fill+'" stroke="none"/>';}

    var s='<svg viewBox="0 0 '+S+' '+S+'" xmlns="http://www.w3.org/2000/svg" shape-rendering="geometricPrecision">';
    s+='<defs><clipPath id="clip'+id+'"><circle cx="'+c+'" cy="'+c+'" r="'+Rclip.toFixed(1)+'"/></clipPath>'+
       '<filter id="paper'+id+'"><feTurbulence type="fractalNoise" baseFrequency="0.85" numOctaves="2" stitchTiles="stitch" result="n"/>'+
       '<feColorMatrix in="n" type="matrix" values="0 0 0 0 0.30  0 0 0 0 0.29  0 0 0 0 0.26  0 0 0 0.7 0"/></filter>'+
       '<radialGradient id="glow'+id+'" cx="50%" cy="50%" r="50%">'+
         '<stop offset="0%" stop-color="'+glow.color+'" stop-opacity="'+glow.alpha+'"/>'+
         '<stop offset="55%" stop-color="'+glow.color+'" stop-opacity="'+(glow.alpha*0.35).toFixed(3)+'"/>'+
         '<stop offset="100%" stop-color="'+glow.color+'" stop-opacity="0"/></radialGradient></defs>';
    s+='<g clip-path="url(#clip'+id+')">';
    s+='<rect width="'+S+'" height="'+S+'" fill="'+base+'"/>';
    s+='<circle cx="'+c+'" cy="'+c+'" r="'+((Rzod+Rout)/2).toFixed(1)+'" fill="none" stroke="'+band+'" stroke-width="'+(Rout-Rzod).toFixed(1)+'"/>';
    s+='<rect width="'+S+'" height="'+S+'" filter="url(#paper'+id+')" opacity="0.05"/>';
    s+='<circle cx="'+c+'" cy="'+c+'" r="'+(glow.reach*S).toFixed(1)+'" fill="url(#glow'+id+')"/>';
    for(var sg=0;sg<12;sg++){ if(sg%2===0){ s+=wedgeEven(sg*30,(sg+1)*30,Rout,Rzod,'rgba(43,41,38,0.022)'); } }
    for(var h=0;h<12;h++){ if(h%2===0){ s+=wedgeCusp(WHEEL_CUSPS[h],WHEEL_CUSPS[(h+1)%12],Rzod,Raring,'rgba(43,41,38,0.040)'); } }
    s+=cir(Rout,GREY.ink,2.8)+cir(Rzod,GREY.ink,1.0)+cir(Raring,'#9a9487',1.0)+cir(Rcore,GREY.innerSoft,1.2);
    for(var sd=0;sd<360;sd+=30){ s+=ln(sd,Rzod,Rout,GREY.divider,1.1); }
    for(var t5=0;t5<360;t5+=5){ if(t5%30!==0){ s+=ln(t5,Rzod,Rzod+0.018*S,GREY.tick5,0.9); } }
    for(var sgi=0;sgi<12;sgi++){ var sa=sgi*30+15, gp=pt(sa,Rsg), gsc=0.0046*S;
      s+='<g transform="translate('+gp[0].toFixed(1)+','+gp[1].toFixed(1)+') scale('+gsc.toFixed(2)+')" stroke="'+GREY.cusp+'" stroke-width="0.7" fill="none" stroke-linecap="round" stroke-linejoin="round">'+wsign(sgi)+'</g>'; }
    WHEEL_CUSPS.forEach(function(cu,i){ if(i===0||i===3||i===6||i===9) return; s+=ln(cu,Rzod,Rcore,GREY.cusp,1.0); });
    for(var i2=0;i2<12;i2++){ var a1=WHEEL_CUSPS[i2],a2=WHEEL_CUSPS[(i2+1)%12];
      var mid=a1+(((a2-a1+540)%360)-180)/2, p=pt(mid,Rnum);
      s+='<text x="'+p[0].toFixed(1)+'" y="'+(p[1]+3*k).toFixed(1)+'" text-anchor="middle" font-size="'+(9*k).toFixed(1)+'" fill="#3f3b34" font-weight="600" font-family="Helvetica,Arial,sans-serif">'+(i2+1)+'</text>'; }
    WHEEL_ASPECTS.forEach(function(pr){
      var A=WHEEL_PLANETS.find(function(x){return x.t===pr[0];}), B=WHEEL_PLANETS.find(function(x){return x.t===pr[1];});
      if(!A||!B) return; var p1=pt(A.a,Raring),p2=pt(B.a,Raring),col=ASPCOL[pr[2]], w=(pr[2]==='minor'?1.0:1.6);
      var dash=pr[2]==='minor'?' stroke-dasharray="'+(3*k)+' '+(3*k)+'"':'';
      s+='<line x1="'+p1[0].toFixed(2)+'" y1="'+p1[1].toFixed(2)+'" x2="'+p2[0].toFixed(2)+'" y2="'+p2[1].toFixed(2)+'" stroke="'+col+'" stroke-width="'+(w*k).toFixed(2)+'" stroke-linecap="round"'+dash+'/>'; });
    WHEEL_PLANETS.forEach(function(p){ s+=ln(p.a,Raring,Raring+0.014*S,'#8f897c',0.9); });
    WHEEL_PLANETS.forEach(function(p){
      s+=ln(p.a,Rzod,Rzod+0.018*S,GREY.ink,1.1);
      var g=pt(p.a,Rplanet), sc=0.0052*S;
      s+='<g transform="translate('+g[0].toFixed(1)+','+g[1].toFixed(1)+') scale('+sc.toFixed(2)+')" stroke="'+GREY.ink+'" stroke-width="0.8" fill="none" stroke-linecap="round" stroke-linejoin="round" style="color:'+GREY.ink+'">'+wglyph(p.t)+'</g>'; });
    [0,9,6,3].forEach(function(ci){ var cu=WHEEL_CUSPS[ci];
      s+=ln(cu,Rzod,Rcore,GREY.ink,2.2)+ln(cu,Rout-1,Rout+0.012*S,GREY.ink,2.2); });
    s+='</g></svg>';
    return s;
  }

      '<textarea placeholder="Leave a note about this '+kind+'…"></textarea>');
  }
</script>
