<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Profile Workspace — v07 (warming up)</title>

<!--
  ============================================================
  prototype_profile_workspace_v07.html
  ============================================================
  First pass at WARMING the locked v06 page + wiring in the real
  chart wheel language from chart-wheel v09.

  Applied this round:
  - Real SVG wheels (greyer paper, cream only in the band layer,
    confined gold glow "from within", quiet teal aura outside).
  - Pills: Natal | Current Location | Comparison.
      · Current Location is NOT a carousel (single fixed chart).
      · Comparison = Natal + Current Location only (the two that matter),
        and the second chart slides in "out of the drawer" (motion =
        discovery, not pre-fab).
  - Aspect-to-Angle is a CAROUSEL (choose one angle, slides between
    ASC/MC/DSC/IC). A "View all four" toggle shows them side by side
    (columns are thin enough now). Aspect format toggle: text (Conj/Sq)
    vs glyph only.
  - Tables simplified: house = "5" not "5th"; planet glyphs removed;
    signs abbreviated (Tau, Cap…); aspects abbreviated (Conj/Sq/Tri…).
    Applying/separating legend stays removed; orb is quiet grey.
  - Less boxy: soft tinted cards, hairline rhythm, more air; page
    carries a faint warm pulsation so it's "a little less grey."

  Parked (not this round): real geometry, comparison PAGE layout
  (Planet | House(Boston) | House(Philly)…), final palette, the
  remaining wheel tuning notes (10°>5° ticks, calmer house shading,
  brighter-but-quieter glow, gold-soul/teal-skin).
  ============================================================
-->

<style>
  :root {
    --ink:#2c2a26; --ink-soft:#615d54; --ink-faint:#938e83;
    --line:#e6e1d6; --line-soft:#efebe2;
    --paper:#f2f0ea; --card:#faf8f2; --card-2:#f6f3ec;
    --accent:#5b6b63; --gold:#b89a55; --teal:#5f8a90;
    --radius:10px;
  }
  * { box-sizing:border-box; }
  html, body { margin:0; padding:0; color:var(--ink);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif;
    font-size:15px; line-height:1.45;
    background:
      radial-gradient(120% 90% at 50% -10%, rgba(184,154,85,.07), rgba(184,154,85,0) 55%),
      var(--paper); }
  .wrap { max-width:1180px; margin:0 auto; padding:0 26px 70px; }

  /* header */
  .topbar { display:flex; align-items:center; justify-content:space-between; gap:24px;
    padding:16px 0; margin-bottom:8px; }
  .brand { font-size:15px; font-weight:600; letter-spacing:.01em; flex:0 0 auto; }
  .mainmenu { display:flex; gap:2px; flex:1 1 auto; justify-content:center; flex-wrap:wrap; }
  .mainmenu a { font-size:13.5px; color:var(--ink-soft); text-decoration:none; padding:6px 11px; border-radius:8px; }
  .mainmenu a:hover { background:rgba(184,154,85,.10); color:var(--ink); }
  .account { position:relative; flex:0 0 auto; }
  .account-btn { display:flex; align-items:center; gap:8px; font-size:13.5px; color:var(--ink-soft);
    background:transparent; border:1px solid transparent; border-radius:8px; padding:7px 10px; cursor:pointer; }
  .account-btn:hover { background:rgba(184,154,85,.10); }
  .account-btn .chev { color:var(--ink-faint); font-size:11px; }
  .account .menu { position:absolute; right:0; top:calc(100% + 6px); min-width:180px;
    background:var(--card); border:1px solid var(--line); border-radius:var(--radius);
    padding:6px; display:none; z-index:20; box-shadow:0 8px 24px rgba(44,42,38,.12); }
  .account.open .menu { display:block; }
  .account .menu a { display:block; font-size:13.5px; color:var(--ink-soft); text-decoration:none; padding:8px 10px; border-radius:7px; }
  .account .menu a:hover { background:var(--line-soft); color:var(--ink); }

  button,.btn { font:inherit; font-size:13px; color:var(--ink-soft); background:var(--card);
    border:1px solid var(--line); border-radius:8px; padding:6px 10px; cursor:pointer;
    transition:border-color .15s ease, background .15s ease, color .15s ease; }
  button:hover,.btn:hover { border-color:var(--ink-faint); }
  .linkbtn { background:transparent; border:none; color:var(--ink-faint); padding:2px 6px; font-size:12px; }
  .linkbtn:hover { color:var(--accent); }

  /* pills */
  .view-pills { display:inline-flex; gap:4px; padding:4px; margin:6px 0 24px;
    background:rgba(184,154,85,.07); border:1px solid var(--line); border-radius:999px; }
  .view-pills .chip { font-size:13px; padding:7px 20px; border:none; background:transparent;
    color:var(--ink-soft); border-radius:999px; cursor:pointer; }
  .view-pills .chip.on { background:var(--card); color:var(--ink); font-weight:600;
    box-shadow:0 1px 3px rgba(44,42,38,.10); }

  /* charts */
  .charts { display:grid; gap:34px; align-items:start; }
  .charts.single { grid-template-columns:1fr; max-width:880px; }
  .charts.sxs { grid-template-columns:1fr 1fr; }
  @media (max-width:880px){ .charts.sxs{ grid-template-columns:1fr; } }

  .chart-head { display:flex; gap:22px; align-items:center; margin-bottom:18px; }
  .charts.sxs .chart-head { flex-direction:column; align-items:flex-start; gap:14px; }
  .plate { font-size:12px; line-height:1.45; flex:0 0 auto; min-width:200px; }
  .charts.single .plate { min-width:230px; }
  .plate .name-row { display:flex; align-items:center; gap:8px; margin-bottom:6px; flex-wrap:wrap; }
  .profile-select { font-size:16px; font-weight:600; color:var(--ink);
    background:transparent; border:none; padding:0; cursor:pointer; display:flex; align-items:center; gap:6px; }
  .profile-select .chev { font-size:11px; color:var(--ink-faint); }
  .plate .primary { color:var(--ink); }
  .plate .sub { color:var(--ink-faint); }
  .plate .gap { height:7px; }
  .reloc-block { margin-top:9px; padding-top:8px; border-top:1px solid var(--line-soft); }
  .reloc-block .reloc { font-size:10.5px; text-transform:uppercase; letter-spacing:.10em; color:var(--gold); font-weight:600; }
  .reloc-block .big { font-size:14.5px; font-weight:600; color:var(--ink); }

  .wheel-wrap { flex:1 1 auto; display:flex; justify-content:center; }
  .disc { border-radius:50%; overflow:hidden;
    box-shadow: 0 0 26px 1px rgba(184,154,85,.14), 0 0 18px 1px rgba(95,138,144,.10),
                0 2px 8px rgba(44,42,38,.14), inset 0 0 0 1px rgba(44,42,38,.05); }
  .charts.single .disc { width:330px; }
  .charts.sxs .disc { width:300px; max-width:100%; }
  .disc svg { display:block; width:100%; height:auto; }

  /* reference row — soft, less boxy */
  .ref-row { display:grid; grid-template-columns:1fr 1fr; gap:18px; align-items:start; }
  @media (max-width:560px){ .ref-row{ grid-template-columns:1fr; } }
  .tcard { background:var(--card); border-radius:var(--radius); padding:4px 4px 8px;
    box-shadow:0 1px 2px rgba(44,42,38,.06), inset 0 0 0 1px rgba(184,154,85,.05); }
  .tcard h3 { font-size:11px; font-weight:600; text-transform:uppercase; letter-spacing:.08em;
    color:var(--ink-soft); margin:0; padding:10px 12px 8px; }
  .subhead { font-size:10.5px; font-weight:600; text-transform:uppercase; letter-spacing:.07em;
    color:var(--gold); padding:8px 12px 4px; }
  table { width:100%; border-collapse:collapse; }
  .rt th,.rt td { text-align:left; padding:2.5px 12px; font-size:12.5px; line-height:1.5; }
  .rt th { font-weight:500; color:var(--ink-faint); font-size:10px; text-transform:uppercase;
    letter-spacing:.05em; padding-bottom:4px; border-bottom:1px solid var(--line-soft); }
  .rt td.pl { color:var(--ink-soft); }
  .rt td.hs { color:var(--ink); font-weight:600; width:38px; }
  .rt td.angle-name { color:var(--ink-soft); font-weight:600; }
  .rt .dim { color:var(--line); }
  .rt .asp { color:var(--ink); }
  .rt .orb { font-size:11px; color:var(--ink-faint); margin-left:6px; }
  .rt .aglyph { color:var(--ink); font-size:13px; }

  /* A2A carousel */
  .a2a-top { display:flex; align-items:center; justify-content:space-between; gap:10px;
    flex-wrap:wrap; padding:8px 10px 6px; }
  .seg { display:inline-flex; gap:2px; padding:3px; background:var(--card-2);
    border:1px solid var(--line); border-radius:999px; }
  .seg button { font-size:11px; padding:3px 9px; border:none; background:transparent;
    color:var(--ink-soft); border-radius:999px; }
  .seg button.on { background:var(--card); color:var(--ink); font-weight:600; box-shadow:0 1px 2px rgba(44,42,38,.10); }
  .anav { display:inline-flex; align-items:center; gap:8px; }
  .anav .arrow { width:26px; height:26px; padding:0; border-radius:50%; line-height:1; }
  .anav .angle-now { font-size:12.5px; font-weight:600; color:var(--ink); min-width:38px; text-align:center; }
  .dots { display:flex; gap:5px; justify-content:center; padding:2px 0 6px; }
  .dots i { width:6px; height:6px; border-radius:50%; background:var(--line); cursor:pointer; transition:background .15s; }
  .dots i.on { background:var(--gold); }

  .a2a-viewport { overflow:hidden; }
  .a2a-track { display:flex; width:400%; transition:transform .4s cubic-bezier(.22,.61,.36,1); }
  .a2a-panel { width:25%; flex:0 0 25%; padding:0 2px; }

  .a2a-four { display:none; grid-template-columns:1fr 1fr 1fr 1fr; gap:6px; padding:2px; }
  .a2a-four.show { display:grid; }
  .a2a-viewport.hide { display:none; }
  .a2a-four .col .subhead { text-align:center; padding:6px 2px 3px; }
  .a2a-four .rt th,.a2a-four .rt td { padding:2px 6px; font-size:11.5px; }
  @media (max-width:560px){ .a2a-four{ grid-template-columns:1fr 1fr; } }

  /* drawer reveal for comparison */
  @keyframes drawerIn { from{ transform:translateX(7%); opacity:0; } to{ transform:none; opacity:1; } }
  .drawer-in { animation: drawerIn .46s cubic-bezier(.22,.61,.36,1) both; }
  @keyframes fadeUp { from{ transform:translateY(6px); opacity:0; } to{ transform:none; opacity:1; } }
  .fade-up { animation: fadeUp .34s ease both; }

  /* lower section */
  .lower { margin-top:40px; padding-top:26px; border-top:1px solid var(--line);
    display:grid; grid-template-columns:1.5fr 1fr 1fr; gap:24px; align-items:start; }
  @media (max-width:880px){ .lower{ grid-template-columns:1fr; } }
  .panel h3 { font-size:11px; font-weight:600; text-transform:uppercase; letter-spacing:.08em;
    color:var(--ink-soft); margin:0 0 12px; }
  .compare-btn { margin-bottom:10px; opacity:.45; pointer-events:none; }
  .compare-btn.active { opacity:1; pointer-events:auto; background:var(--accent); color:#fff; border-color:var(--accent); }
  .fav { list-style:none; margin:0; padding:0; }
  .fav li { display:flex; align-items:center; gap:10px; padding:5px 0; }
  .fav input[type=checkbox] { width:15px; height:15px; flex:0 0 auto; accent-color:var(--accent); }
  .fav .star { color:var(--ink-faint); cursor:pointer; font-size:15px; user-select:none; flex:0 0 auto; }
  .fav .star.on { color:var(--gold); }
  .fav .city { flex:1 1 auto; display:inline-flex; align-items:center; gap:6px; cursor:pointer;
    padding:5px 10px; margin:-5px -10px; border-radius:8px;
    transition:background .15s ease, box-shadow .15s ease, color .15s ease; }
  .fav .city .name { font-size:13.5px; color:var(--ink); }
  .fav .city .go { color:var(--ink-faint); font-size:14px; margin-left:auto; }
  .fav .city:hover { background:rgba(184,154,85,.10); box-shadow:0 0 0 1px var(--line-soft); }
  .fav .city:hover .go { color:var(--gold); }

  .list { list-style:none; margin:0; padding:0; }
  .list li { display:flex; align-items:baseline; justify-content:space-between; gap:10px;
    padding:8px 0; border-top:1px solid var(--line-soft); font-size:13px; }
  .list li:first-child { border-top:none; }
  .list .meta { font-size:11.5px; color:var(--ink-faint); white-space:nowrap; }
  .notes-link { font-size:11px; color:var(--ink-faint); text-decoration:none; border-bottom:1px dotted var(--line); margin-left:8px; }
  .notes-link:hover { color:var(--ink-soft); }

  /* modal */
  .modal-back { position:fixed; inset:0; background:rgba(40,38,34,.34); display:none;
    align-items:center; justify-content:center; z-index:50; padding:24px; }
  .modal-back.open { display:flex; }
  .modal { background:var(--card); border:1px solid var(--line); border-radius:12px; max-width:560px;
    width:100%; max-height:86vh; overflow:auto; padding:22px; box-shadow:0 18px 50px rgba(44,42,38,.22); }
  .modal h2 { font-size:16px; margin:0 0 12px; }
  .modal .close { float:right; }
  .modal textarea { width:100%; min-height:120px; border:1px solid var(--line); border-radius:8px;
    background:var(--paper); padding:10px; font:inherit; font-size:13.5px; resize:vertical; }
</style>
</head>
<body>
<div class="wrap">

  <header class="topbar">
    <div class="brand">Relocation</div>
    <nav class="mainmenu">
      <a href="#">View Map</a><a href="#">Profile</a><a href="#">Comparison</a>
      <a href="#">Transit Lab</a><a href="#">Store</a><a href="#">Help</a><a href="#">Settings</a>
    </nav>
    <div class="account" id="account">
      <button class="account-btn" id="accountBtn">David Goodman <span class="chev">▾</span></button>
      <div class="menu"><a href="#">Account</a><a href="#">Billing</a><a href="#">Sign out</a></div>
    </div>
  </header>

  <div class="view-pills" id="viewPills">
    <button class="chip on" data-view="natal">Natal</button>
    <button class="chip" data-view="current">Current Location</button>
    <button class="chip" data-view="comparison">Comparison</button>
  </div>

  <div class="charts single" id="charts"></div>

  <div class="lower" id="lower"></div>
</div>

<div class="modal-back" id="modalBack"><div class="modal" id="modal"></div></div>

<script>
  /* ---------- account dropdown ---------- */
  (function(){
    var acct=document.getElementById('account'), btn=document.getElementById('accountBtn');
    btn.addEventListener('click',function(e){e.stopPropagation();acct.classList.toggle('open');});
    document.addEventListener('click',function(){acct.classList.remove('open');});
  })();

  /* ===================================================================
     CHART WHEEL (ported + trimmed from chart-wheel v09)
     =================================================================== */
  var GREY={ink:'#2b2926', cusp:'#8a857a', divider:'#9b968b', tick5:'#c4bfb2', innerSoft:'#9a9485'};
  var WHEEL_PLANETS=[
    {t:'Su',a:200},{t:'Mo',a:95},{t:'Me',a:213},{t:'Ve',a:165},{t:'Ma',a:300},{t:'Ju',a:40},
    {t:'Sa',a:340},{t:'Ur',a:128},{t:'Ne',a:74},{t:'Pl',a:255},{t:'Ch',a:18}
  ];
  var WHEEL_ASPECTS=[
    ['Su','Mo','soft'],['Su','Ma','hard'],['Su','Ju','soft'],['Mo','Ve','soft'],['Mo','Pl','hard'],
    ['Me','Ve','soft'],['Me','Ma','hard'],['Ve','Sa','soft'],['Ma','Pl','hard'],['Ju','Sa','hard'],
    ['Ur','Ne','soft'],['Ne','Pl','soft'],['Su','Sa','minor'],['Me','Ne','minor']
  ];
  var WHEEL_CUSPS=[180,146,118,84,56,24,0,326,298,264,236,204];
  var ASPCOL={hard:'#a8392c', soft:'#3d6b86', minor:'#9a7a3a'};

  function wglyph(t){ switch(t){
    case 'Su': return '<circle cx="0" cy="0" r="3.4"/><circle cx="0" cy="0" r="0.8" fill="currentColor"/>';
    case 'Mo': return '<path d="M1.7,-3.7 A3.8,3.8 0 1 0 1.7,3.7 A2.6,3.8 0 1 1 1.7,-3.7 Z" fill="currentColor" stroke="none"/>';
    case 'Me': return '<circle cx="0" cy="0" r="2"/><path d="M-2,-3.8 A2,2 0 0 0 2,-3.8"/><line x1="0" y1="2" x2="0" y2="4.7"/><line x1="-1.5" y1="3.4" x2="1.5" y2="3.4"/>';
    case 'Ve': return '<circle cx="0" cy="-1.1" r="2.1"/><line x1="0" y1="1" x2="0" y2="4.7"/><line x1="-1.6" y1="2.9" x2="1.6" y2="2.9"/>';
    case 'Ma': return '<circle cx="-1.1" cy="1.3" r="2.3"/><line x1="0.7" y1="-0.6" x2="3.9" y2="-3.8"/><line x1="3.9" y1="-3.8" x2="2.0" y2="-3.8"/><line x1="3.9" y1="-3.8" x2="3.9" y2="-1.9"/>';
    case 'Ju': return '<path d="M-3.2,-2.4 C-3.2,-4.5 0.2,-4.5 0.2,-1 L0.2,4.5"/><line x1="-1.5" y1="1.5" x2="3.4" y2="1.5"/>';
    case 'Sa': return '<path d="M-2.8,-3 C-1,-4.3 1.7,-3.6 1.7,-0.8 C1.7,2.4 0,4.5 -2.4,4.5"/><line x1="-3.6" y1="-1.3" x2="0.2" y2="-1.3"/>';
    case 'Ur': return '<line x1="0" y1="-4.1" x2="0" y2="2.4"/><line x1="-2.8" y1="-1.5" x2="2.8" y2="-1.5"/><line x1="-2.8" y1="-3.2" x2="-2.8" y2="0"/><line x1="2.8" y1="-3.2" x2="2.8" y2="0"/><circle cx="0" cy="3.6" r="1.1"/>';
    case 'Ne': return '<line x1="0" y1="-2.4" x2="0" y2="4.5"/><path d="M-3.2,-3.2 L-3.2,0.4 M3.2,-3.2 L3.2,0.4 M-3.2,0.2 Q0,3.2 3.2,0.2"/><line x1="-1.7" y1="2.6" x2="1.7" y2="2.6"/>';
    case 'Pl': return '<circle cx="0" cy="-1.5" r="1.4"/><path d="M-2,4.5 L-2,-2.8 L0.1,-2.8"/>';
    case 'Ch': return '<circle cx="0" cy="3.2" r="1.7"/><line x1="0" y1="1.5" x2="0" y2="-4.3"/><line x1="0" y1="-2.1" x2="2.6" y2="-4.5"/><line x1="0" y1="-2.1" x2="2.6" y2="0"/>';
  } return ''; }
  function wsign(i){ switch(i){
    case 0:  return '<path d="M-3,2.5 C-3,-3 -0.6,-3 0,0 C0.6,-3 3,-3 3,2.5"/>';
    case 1:  return '<circle cx="0" cy="1.4" r="2.4"/><path d="M-3.4,-3.2 A3 3 0 0 0 3.4,-3.2"/>';
    case 2:  return '<line x1="-2.6" y1="-3" x2="2.6" y2="-3"/><line x1="-2.6" y1="3" x2="2.6" y2="3"/><line x1="-1.4" y1="-3" x2="-1.4" y2="3"/><line x1="1.4" y1="-3" x2="1.4" y2="3"/>';
    case 3:  return '<circle cx="-1.4" cy="-1.2" r="1.3"/><circle cx="1.4" cy="1.2" r="1.3"/><path d="M-2.7,-1.2 A3 3 0 0 1 1.4,-2.6"/><path d="M2.7,1.2 A3 3 0 0 1 -1.4,2.6"/>';
    case 4:  return '<circle cx="-1.2" cy="1.4" r="1.8"/><path d="M0.4,2 C0.4,-2 -1,-3.5 1.4,-3.5 C3,-3.5 3,-1.4 2.2,-0.6"/>';
    case 5:  return '<path d="M-3.4,-2.5 L-3.4,2.5 M-3.4,-2.5 C-2,-3.4 -1,-2.6 -1,-1 L-1,2.5 M-1,-1 C-1,-3 0.6,-3.4 1.2,-1 L1.2,2.5 M1.2,1 C1.2,3.2 3,3 3.2,1.4"/>';
    case 6:  return '<path d="M-3.4,2.4 L3.4,2.4 M-2.6,0 A2.6 2.6 0 0 1 2.6,0 L-2.6,0"/>';
    case 7:  return '<path d="M-3.4,-2.5 L-3.4,2.5 M-3.4,-2.5 C-2,-3.4 -1,-2.6 -1,-1 L-1,2.5 M-1,-1 C-1,-3 0.6,-3.4 1.2,-1 L1.2,3.4"/><path d="M1.2,1 L3.4,3.4 M3.4,1.2 L3.4,3.4 L1.6,3.4"/>';
    case 8:  return '<line x1="-3" y1="3" x2="3" y2="-3"/><line x1="3" y1="-3" x2="0.6" y2="-3"/><line x1="3" y1="-3" x2="3" y2="-0.6"/><line x1="-1.6" y1="0.4" x2="0.6" y2="2.6"/>';
    case 9:  return '<path d="M-3,-3 C-2,-3.4 -1,-2.6 -1,-1 L-1,3 M-1,-1 C-1,-3 1,-3 1.4,-0.6 C2,2 -0.2,3.4 -1.6,2"/>';
    case 10: return '<path d="M-3.4,-1.4 L-1.8,-2.6 L-0.2,-1.4 L1.4,-2.6 L3,-1.4 M-3.4,1.4 L-1.8,0.2 L-0.2,1.4 L1.4,0.2 L3,1.4"/>';
    case 11: return '<path d="M-2.6,-3 C-4,-1 -4,1 -2.6,3 M2.6,-3 C4,-1 4,1 2.6,3 M-3.2,0 L3.2,0"/>';
  } return ''; }

  var wuid=0;
  function buildWheel(S, rot, glowColor){
    wuid++; var c=S/2, k=S/480, id=wuid, R=rot||0;
    var Rclip=0.5*S, Rout=0.41*S, Rzod=0.345*S, Rsg=0.378*S, Rplanet=0.308*S,
        Raring=0.27*S, Rcore=0.072*S, Rnum=0.135*S;
    var base='#eae8e3', band='#f1ece0', glow={color:glowColor||'#b89a55',alpha:0.16,reach:0.20};
    function pt(a,r){var rad=(a+R)*Math.PI/180;return [c+r*Math.cos(rad), c-r*Math.sin(rad)];}
    function ln(a,r1,r2,col,w){var p1=pt(a,r1),p2=pt(a,r2);
      return '<line x1="'+p1[0].toFixed(2)+'" y1="'+p1[1].toFixed(2)+'" x2="'+p2[0].toFixed(2)+'" y2="'+p2[1].toFixed(2)+'" stroke="'+col+'" stroke-width="'+(w*k).toFixed(2)+'"/>';}
    function cir(r,col,w){return '<circle cx="'+c+'" cy="'+c+'" r="'+r.toFixed(2)+'" fill="none" stroke="'+col+'" stroke-width="'+(w*k).toFixed(2)+'"/>';}
    function wedgeEven(a1,a2,rO,rI,fill){var pts=[],a;
      for(a=a1;a<=a2;a+=3){var p=pt(a,rO);pts.push(p[0].toFixed(1)+','+p[1].toFixed(1));}
      for(a=a2;a>=a1;a-=3){var q=pt(a,rI);pts.push(q[0].toFixed(1)+','+q[1].toFixed(1));}
      return '<polygon points="'+pts.join(' ')+'" fill="'+fill+'" stroke="none"/>';}
    function wedgeCusp(a1,a2,rO,rI,fill){var aa2=(a2<a1)?a2:a2-360,pts=[],a;
      for(a=a1;a>=aa2;a-=3){var p=pt(a,rO);pts.push(p[0].toFixed(1)+','+p[1].toFixed(1));}
      for(a=aa2;a<=a1;a+=3){var q=pt(a,rI);pts.push(q[0].toFixed(1)+','+q[1].toFixed(1));}
      return '<polygon points="'+pts.join(' ')+'" fill="'+fill+'" stroke="none"/>';}

    var s='<svg viewBox="0 0 '+S+' '+S+'" xmlns="http://www.w3.org/2000/svg" shape-rendering="geometricPrecision">';
    s+='<defs><clipPath id="clip'+id+'"><circle cx="'+c+'" cy="'+c+'" r="'+Rclip.toFixed(1)+'"/></clipPath>'+
       '<filter id="paper'+id+'"><feTurbulence type="fractalNoise" baseFrequency="0.85" numOctaves="2" stitchTiles="stitch" result="n"/>'+
       '<feColorMatrix in="n" type="matrix" values="0 0 0 0 0.30  0 0 0 0 0.29  0 0 0 0 0.26  0 0 0 0.7 0"/></filter>'+
       '<radialGradient id="glow'+id+'" cx="50%" cy="50%" r="50%">'+
         '<stop offset="0%" stop-color="'+glow.color+'" stop-opacity="'+glow.alpha+'"/>'+
         '<stop offset="55%" stop-color="'+glow.color+'" stop-opacity="'+(glow.alpha*0.35).toFixed(3)+'"/>'+
         '<stop offset="100%" stop-color="'+glow.color+'" stop-opacity="0"/></radialGradient></defs>';
    s+='<g clip-path="url(#clip'+id+')">';
    s+='<rect width="'+S+'" height="'+S+'" fill="'+base+'"/>';
    s+='<circle cx="'+c+'" cy="'+c+'" r="'+((Rzod+Rout)/2).toFixed(1)+'" fill="none" stroke="'+band+'" stroke-width="'+(Rout-Rzod).toFixed(1)+'"/>';
    s+='<rect width="'+S+'" height="'+S+'" filter="url(#paper'+id+')" opacity="0.05"/>';
    s+='<circle cx="'+c+'" cy="'+c+'" r="'+(glow.reach*S).toFixed(1)+'" fill="url(#glow'+id+')"/>';
    for(var sg=0;sg<12;sg++){ if(sg%2===0){ s+=wedgeEven(sg*30,(sg+1)*30,Rout,Rzod,'rgba(43,41,38,0.022)'); } }
    for(var h=0;h<12;h++){ if(h%2===0){ s+=wedgeCusp(WHEEL_CUSPS[h],WHEEL_CUSPS[(h+1)%12],Rzod,Raring,'rgba(43,41,38,0.040)'); } }
    s+=cir(Rout,GREY.ink,2.8)+cir(Rzod,GREY.ink,1.0)+cir(Raring,'#9a9487',1.0)+cir(Rcore,GREY.innerSoft,1.2);
    for(var sd=0;sd<360;sd+=30){ s+=ln(sd,Rzod,Rout,GREY.divider,1.1); }
    for(var t5=0;t5<360;t5+=5){ if(t5%30!==0){ s+=ln(t5,Rzod,Rzod+0.018*S,GREY.tick5,0.9); } }
    for(var sgi=0;sgi<12;sgi++){ var sa=sgi*30+15, gp=pt(sa,Rsg), gsc=0.0046*S;
      s+='<g transform="translate('+gp[0].toFixed(1)+','+gp[1].toFixed(1)+') scale('+gsc.toFixed(2)+')" stroke="'+GREY.cusp+'" stroke-width="0.7" fill="none" stroke-linecap="round" stroke-linejoin="round">'+wsign(sgi)+'</g>'; }
    WHEEL_CUSPS.forEach(function(cu,i){ if(i===0||i===3||i===6||i===9) return; s+=ln(cu,Rzod,Rcore,GREY.cusp,1.0); });
    for(var i2=0;i2<12;i2++){ var a1=WHEEL_CUSPS[i2],a2=WHEEL_CUSPS[(i2+1)%12];
      var mid=a1+(((a2-a1+540)%360)-180)/2, p=pt(mid,Rnum);
      s+='<text x="'+p[0].toFixed(1)+'" y="'+(p[1]+3*k).toFixed(1)+'" text-anchor="middle" font-size="'+(9*k).toFixed(1)+'" fill="#3f3b34" font-weight="600" font-family="-apple-system,Helvetica,Arial,sans-serif">'+(i2+1)+'</text>'; }
    WHEEL_ASPECTS.forEach(function(pr){
      var A=WHEEL_PLANETS.find(function(x){return x.t===pr[0];}), B=WHEEL_PLANETS.find(function(x){return x.t===pr[1];});
      if(!A||!B) return; var p1=pt(A.a,Raring),p2=pt(B.a,Raring),col=ASPCOL[pr[2]], w=(pr[2]==='minor'?1.0:1.6);
      var dash=pr[2]==='minor'?' stroke-dasharray="'+(3*k)+' '+(3*k)+'"':'';
      s+='<line x1="'+p1[0].toFixed(2)+'" y1="'+p1[1].toFixed(2)+'" x2="'+p2[0].toFixed(2)+'" y2="'+p2[1].toFixed(2)+'" stroke="'+col+'" stroke-width="'+(w*k).toFixed(2)+'" stroke-linecap="round"'+dash+'/>'; });
    WHEEL_PLANETS.forEach(function(p){ s+=ln(p.a,Raring,Raring+0.014*S,'#8f897c',0.9); });
    WHEEL_PLANETS.forEach(function(p){
      s+=ln(p.a,Rzod,Rzod+0.018*S,GREY.ink,1.1);
      var g=pt(p.a,Rplanet), sc=0.0052*S;
      s+='<g transform="translate('+g[0].toFixed(1)+','+g[1].toFixed(1)+') scale('+sc.toFixed(2)+')" stroke="'+GREY.ink+'" stroke-width="0.8" fill="none" stroke-linecap="round" stroke-linejoin="round" style="color:'+GREY.ink+'">'+wglyph(p.t)+'</g>'; });
    // angle axes (ASC/MC/DSC/IC use cusp indexes 0/9/6/3)
    [0,9,6,3].forEach(function(ci){ var cu=WHEEL_CUSPS[ci];
      s+=ln(cu,Rzod,Rcore,GREY.ink,2.2)+ln(cu,Rout-1,Rout+0.012*S,GREY.ink,2.2); });
    s+='</g></svg>';
    return s;
  }

  /* ===================================================================
     TABLE DATA + SIMPLIFICATION HELPERS
     =================================================================== */
  var PLANET_NAMES=["Sun","Moon","Mercury","Venus","Mars","Jupiter","Saturn","Uranus","Neptune","Pluto","Chiron"];
  var ASPECT_PLANETS=PLANET_NAMES.concat(["ASC","MC"]);

  var SIGN_ABBR={Aries:"Ari",Taurus:"Tau",Gemini:"Gem",Cancer:"Can",Leo:"Leo",Virgo:"Vir",
    Libra:"Lib",Scorpio:"Sco",Sagittarius:"Sag",Capricorn:"Cap",Aquarius:"Aqu",Pisces:"Pis"};
  var ASP_ABBR={Conjunct:"Conj",Square:"Sq",Trine:"Tri",Opposition:"Opp",Sextile:"Sex"};
  var ASP_GLYPH={Conjunct:"\u260C",Sextile:"\u26B9",Square:"\u25A1",Trine:"\u25B3",Opposition:"\u260D"};

  function houseNum(h){ return String(h).replace(/(st|nd|rd|th)$/,''); }
  function abbrPos(pos){ return pos.replace(/\b([A-Z][a-z]+)\b/, function(m){ return SIGN_ABBR[m]||m; }); }

  var aspectFmt='text'; // 'text' | 'glyph'
  function aspectCell(r){
    if(!r||!r.aspect) return '<span class="dim">·</span>';
    if(aspectFmt==='glyph'){
      return '<span class="aglyph" title="'+r.aspect+'">'+(ASP_GLYPH[r.aspect]||r.aspect)+'</span>'+
             '<span class="orb">'+r.orb+'</span>';
    }
    return '<span class="asp">'+(ASP_ABBR[r.aspect]||r.aspect)+'</span>'+
           '<span class="orb">'+r.orb+'</span>';
  }

  function pihCard(data){
    var rows=PLANET_NAMES.map(function(n,i){
      return '<tr><td class="pl">'+n+'</td><td class="hs">'+houseNum(data.houses[i])+'</td></tr>'; }).join('');
    var ang=data.angles.map(function(a){
      return '<tr><td class="angle-name">'+a.angle+'</td><td>'+abbrPos(a.position)+'</td></tr>'; }).join('');
    return '<div class="tcard">'+
      '<h3>Planet in House</h3>'+
      '<table class="rt"><thead><tr><th>Planet</th><th>House</th></tr></thead><tbody>'+rows+'</tbody></table>'+
      '<div class="subhead">Angle in Sign</div>'+
      '<table class="rt"><tbody>'+ang+'</tbody></table></div>';
  }

  function a2aTable(rows){
    var body=ASPECT_PLANETS.map(function(n,i){
      return '<tr><td class="pl">'+n+'</td><td>'+aspectCell(rows&&rows[i])+'</td></tr>'; }).join('');
    return '<table class="rt"><tbody>'+body+'</tbody></table>';
  }

  var ORDER=['ASC','MC','DSC','IC'];
  // per-chart A2A state
  var a2aState={}; // key -> {idx, mode}

  function a2aCard(key,aspects){
    var st=a2aState[key]||(a2aState[key]={idx:0,mode:'carousel'});
    var dots=ORDER.map(function(a,i){ return '<i class="'+(i===st.idx?'on':'')+'" data-act="a2adot" data-key="'+key+'" data-i="'+i+'"></i>'; }).join('');
    var panels=ORDER.map(function(a){ return '<div class="a2a-panel"><div class="subhead">'+a+' aspects</div>'+a2aTable(aspects[a])+'</div>'; }).join('');
    var four=ORDER.map(function(a){ return '<div class="col"><div class="subhead">'+a+'</div>'+a2aTable(aspects[a])+'</div>'; }).join('');
    return '<div class="tcard">'+
      '<div class="a2a-top">'+
        '<div class="anav">'+
          '<button class="arrow" data-act="a2aprev" data-key="'+key+'">‹</button>'+
          '<span class="angle-now" id="angle-now-'+key+'">'+ORDER[st.idx]+'</span>'+
          '<button class="arrow" data-act="a2anext" data-key="'+key+'">›</button>'+
        '</div>'+
        '<div style="display:flex;gap:8px;align-items:center">'+
          '<div class="seg">'+
            '<button class="'+(st.mode==='carousel'?'on':'')+'" data-act="a2amode" data-key="'+key+'" data-mode="carousel">One</button>'+
            '<button class="'+(st.mode==='four'?'on':'')+'" data-act="a2amode" data-key="'+key+'" data-mode="four">All four</button>'+
          '</div>'+
          '<div class="seg">'+
            '<button class="'+(aspectFmt==='text'?'on':'')+'" data-act="afmt" data-fmt="text">Conj</button>'+
            '<button class="'+(aspectFmt==='glyph'?'on':'')+'" data-act="afmt" data-fmt="glyph">\u25B3</button>'+
          '</div>'+
        '</div>'+
      '</div>'+
      '<div class="dots">'+dots+'</div>'+
      '<div class="a2a-viewport'+(st.mode==='four'?' hide':'')+'" id="a2avp-'+key+'">'+
        '<div class="a2a-track" id="a2atrack-'+key+'" style="transform:translateX(-'+(st.idx*25)+'%)">'+panels+'</div>'+
      '</div>'+
      '<div class="a2a-four'+(st.mode==='four'?' show':'')+'" id="a2afour-'+key+'">'+four+'</div>'+
    '</div>';
  }

  /* ===================================================================
     CHARTS
     =================================================================== */
  var CHARTS={};
  function renderChart(host,key,plateHtml,data,rot,glow,animClass){
    CHARTS[key]={data:data};
    host.innerHTML=
      '<div class="chart-head">'+plateHtml+
        '<div class="wheel-wrap"><div class="disc">'+buildWheel(360,rot,glow)+'</div></div>'+
      '</div>'+
      '<div class="ref-row">'+pihCard(data)+a2aCard(key,data.aspects)+'</div>';
    if(animClass) host.classList.add(animClass);
  }

  var NATAL_PROFILE={name:"Avery Rhodes",birthDate:"14 March 1989",birthTime:"07:42",
    offset:"+00:00",birthPlace:"Lisbon, Portugal",lat:"38.7223\u00B0 N",lon:"9.1393\u00B0 W",
    zodiac:"Tropical",houses:"Placidus"};

  function plate(p,reloc){
    var r='';
    if(reloc){ r='<div class="reloc-block"><div class="reloc">Current location</div>'+
      '<div class="big">'+reloc.place+'</div>'+
      '<div class="sub">'+reloc.lat+', '+reloc.lon+'</div></div>'; }
    return '<div class="plate">'+
      '<div class="name-row">'+
        '<button class="profile-select">'+p.name+' <span class="chev">▾</span></button>'+
        '<button class="linkbtn">Edit</button><button class="linkbtn">Add</button>'+
      '</div>'+
      '<div class="primary">'+p.birthDate+'</div>'+
      '<div class="primary">'+p.birthTime+'</div>'+
      '<div class="primary">'+p.birthPlace+'</div>'+
      '<div class="gap"></div>'+
      '<div class="sub">UTC '+p.birthTime+' · '+p.offset+'</div>'+
      '<div class="sub">'+p.lat+', '+p.lon+'</div>'+
      '<div class="sub">'+p.zodiac+' · '+p.houses+'</div>'+ r +
    '</div>';
  }

  var natalAspects={
    ASC:[{},{aspect:"Square",orb:"3\u00B0 08'"},{},{},{aspect:"Conjunct",orb:"0\u00B0 41'"},{},{},{},{},{},{},{},{aspect:"Square",orb:"1\u00B0 10'"}],
    MC:[{aspect:"Conjunct",orb:"2\u00B0 38'"},{},{},{aspect:"Trine",orb:"1\u00B0 12'"},{},{},{},{},{},{},{},{aspect:"Square",orb:"1\u00B0 10'"},{}],
    DSC:[{},{},{},{},{aspect:"Opposition",orb:"0\u00B0 41'"},{},{},{},{},{},{}],
    IC:[{aspect:"Opposition",orb:"2\u00B0 38'"},{},{},{},{},{},{aspect:"Square",orb:"4\u00B0 02'"},{},{},{},{}]
  };
  var NATAL={houses:["10th","4th","9th","11th","1st","7th","5th","8th","6th","5th","12th"],
    angles:[{angle:"ASC",position:"11\u00B0 Taurus 04'"},{angle:"MC",position:"26\u00B0 Capricorn 19'"},
            {angle:"DSC",position:"11\u00B0 Scorpio 04'"},{angle:"IC",position:"26\u00B0 Cancer 19'"}],
    aspects:natalAspects};

  var CURRENT={place:"Austin, TX USA", lat:"30.2672\u00B0 N", lon:"97.7431\u00B0 W",
    houses:["7th","1st","6th","8th","10th","4th","2nd","5th","3rd","2nd","9th"],
    angles:[{angle:"ASC",position:"02\u00B0 Leo 18'"},{angle:"MC",position:"19\u00B0 Aries 47'"},
            {angle:"DSC",position:"02\u00B0 Aquarius 18'"},{angle:"IC",position:"19\u00B0 Libra 47'"}],
    aspects:{
      ASC:[{aspect:"Trine",orb:"1\u00B0 55'"},{},{},{},{},{},{},{},{},{},{},{},{aspect:"Sextile",orb:"2\u00B0 02'"}],
      MC:[{},{aspect:"Sextile",orb:"2\u00B0 10'"},{},{},{},{aspect:"Conjunct",orb:"0\u00B0 33'"},{},{},{},{},{},{},{aspect:"Sextile",orb:"2\u00B0 02'"},{}],
      DSC:[{},{},{aspect:"Square",orb:"3\u00B0 41'"},{},{},{},{},{},{},{},{}],
      IC:[{},{},{},{},{},{},{},{},{aspect:"Trine",orb:"2\u00B0 04'"},{},{}]
    }};

  var mainView='natal';
  function renderApp(animate){
    var charts=document.getElementById('charts');
    if(mainView==='natal'){
      charts.className='charts single';
      charts.innerHTML='<section id="chart-natal" class="fade-up"></section>';
      renderChart(document.getElementById('chart-natal'),'natal',plate(NATAL_PROFILE),NATAL,0,'#b89a55');
    } else if(mainView==='current'){
      charts.className='charts single';
      charts.innerHTML='<section id="chart-current" class="fade-up"></section>';
      renderChart(document.getElementById('chart-current'),'current',
        plate(NATAL_PROFILE,CURRENT),CURRENT,-52,'#5f8a90');
    } else {
      charts.className='charts sxs';
      charts.innerHTML='<section id="chart-natal" class="fade-up"></section><section id="chart-current"></section>';
      renderChart(document.getElementById('chart-natal'),'natal',plate(NATAL_PROFILE),NATAL,0,'#b89a55');
      renderChart(document.getElementById('chart-current'),'current',
        plate(NATAL_PROFILE,CURRENT),CURRENT,-52,'#5f8a90','drawer-in');
    }
  }
  renderApp();

  document.getElementById('viewPills').addEventListener('click',function(e){
    var b=e.target.closest('button'); if(!b) return;
    this.querySelectorAll('button').forEach(function(x){x.classList.remove('on');}); b.classList.add('on');
    mainView=b.dataset.view; renderApp(true);
  });

  /* ---- A2A interactions (slide animation via transform) ---- */
  function setA2A(key){
    var st=a2aState[key]; var track=document.getElementById('a2atrack-'+key);
    if(track) track.style.transform='translateX(-'+(st.idx*25)+'%)';
    var now=document.getElementById('angle-now-'+key); if(now) now.textContent=ORDER[st.idx];
    var dotsWrap=document.querySelector('#chart-'+key+' .dots') ||
                 (document.getElementById('a2avp-'+key)?document.getElementById('a2avp-'+key).previousElementSibling:null);
    // refresh dots
    var card=document.getElementById('a2atrack-'+key); if(card){
      var dots=card.closest('.tcard').querySelectorAll('.dots i');
      dots.forEach(function(d,i){ d.classList.toggle('on', i===st.idx); });
    }
  }
  function rerenderA2A(key){
    var host=document.getElementById('chart-'+key); if(!host) return;
    var wrap=host.querySelector('.tcard:last-child');
    if(wrap) wrap.outerHTML=a2aCard(key,CHARTS[key].data.aspects);
  }

  document.addEventListener('click',function(e){
    var b=e.target.closest('[data-act]'); if(!b) return;
    var act=b.getAttribute('data-act'), key=b.getAttribute('data-key');
    if(act==='a2aprev'){ var s=a2aState[key]; s.idx=(s.idx+3)%4; s.mode='carousel'; setA2A(key); syncMode(key); return; }
    if(act==='a2anext'){ var s2=a2aState[key]; s2.idx=(s2.idx+1)%4; s2.mode='carousel'; setA2A(key); syncMode(key); return; }
    if(act==='a2adot'){ var s3=a2aState[key]; s3.idx=+b.getAttribute('data-i'); setA2A(key); return; }
    if(act==='a2amode'){ a2aState[key].mode=b.getAttribute('data-mode'); rerenderA2A(key); return; }
    if(act==='afmt'){ aspectFmt=b.getAttribute('data-fmt'); Object.keys(a2aState).forEach(rerenderA2A); return; }
  });
  function syncMode(key){
    var vp=document.getElementById('a2avp-'+key), fr=document.getElementById('a2afour-'+key);
    if(vp) vp.classList.remove('hide'); if(fr) fr.classList.remove('show');
  }

  /* ===================================================================
     LOWER SECTION
     =================================================================== */
  var FAVORITES=[
    {name:"Natal (Birth Chart)",fav:true},
    {name:"Current — Austin, TX USA",fav:true},
    {name:"Lisbon, Portugal",fav:false},
    {name:"Tokyo, Japan",fav:false}
  ];
  function favoritesPanel(){
    var rows=FAVORITES.map(function(c,i){
      return '<li>'+
        '<input type="checkbox" class="fav-check" data-i="'+i+'"'+(i<2?' checked':'')+'>'+
        '<span class="star'+(c.fav?' on':'')+'" data-i="'+i+'">\u2605</span>'+
        '<span class="city" data-i="'+i+'"><span class="name">'+c.name+'</span><span class="go">›</span></span>'+
      '</li>'; }).join('');
    return '<section class="panel"><h3>Favorites</h3>'+
      '<button class="compare-btn" id="compareBtn">Compare (0)</button>'+
      '<ul class="fav">'+rows+'</ul></section>';
  }
  var COMPARISONS=[{t:"Lisbon vs. Austin",meta:"2 charts"},{t:"Lyon vs. Wellington vs. Lisbon",meta:"3 charts"}];
  var SEARCHES=[{t:"Venus line within 200km of coast",meta:"Europe"},{t:"Strong MC relocations",meta:"Global"}];
  function listPanel(title,items,kind){
    var rows=items.map(function(it,i){
      return '<li><span>'+it.t+'</span><span class="meta">'+it.meta+
        ' <a href="#" class="notes-link" data-kind="'+kind+'" data-i="'+i+'">notes</a></span></li>'; }).join('');
    return '<section class="panel"><h3>'+title+'</h3><ul class="list">'+rows+'</ul></section>';
  }
  document.getElementById('lower').innerHTML=
    favoritesPanel()+listPanel('Saved Comparisons',COMPARISONS,'comparison')+listPanel('Saved Searches',SEARCHES,'search');

  (function(){
    var lower=document.getElementById('lower'), compareBtn=document.getElementById('compareBtn');
    function refresh(){ var n=lower.querySelectorAll('.fav-check:checked').length;
      compareBtn.textContent='Compare ('+n+')'; compareBtn.classList.toggle('active', n>=2 && n<=5); }
    lower.addEventListener('change',function(e){ if(e.target.classList.contains('fav-check')) refresh(); });
    lower.addEventListener('click',function(e){
      var star=e.target.closest('.star'); if(star){ star.classList.toggle('on'); return; }
      var city=e.target.closest('.city'); if(city){ openCityModal(FAVORITES[+city.getAttribute('data-i')]); return; }
      var nl=e.target.closest('.notes-link'); if(nl){ e.preventDefault(); openNotesModal(nl.getAttribute('data-kind'),+nl.getAttribute('data-i')); }
    });
    refresh();
  })();

  /* ---- modal ---- */
  var modalBack=document.getElementById('modalBack'), modal=document.getElementById('modal');
  function openModal(html){ modal.innerHTML='<button class="close" onclick="closeModal()">Close</button>'+html; modalBack.classList.add('open'); }
  function closeModal(){ modalBack.classList.remove('open'); }
  modalBack.addEventListener('click',function(e){ if(e.target===modalBack) closeModal(); });
  window.closeModal=closeModal;
  function openCityModal(city){
    a2aState['modal']={idx:0,mode:'four'};
    openModal('<h2>'+city.name+'</h2><div class="ref-row">'+pihCard(CURRENT)+a2aCard('modal',CURRENT.aspects)+'</div>');
  }
  function openNotesModal(kind,i){
    var src=kind==='comparison'?COMPARISONS:SEARCHES, title=src[i]?src[i].t:'Notes';
    openModal('<h2>'+title+'</h2><p style="font-size:12.5px;color:#938e83;margin:0 0 8px">Notes</p>'+
      '<textarea placeholder="Leave a note about this '+kind+'…"></textarea>');
  }
</script>
