<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="2040" viewBox="0 0 1440 2040">
  <defs>
    <style>
      .serif { font-family: Georgia, "Times New Roman", serif; }
      .sans { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
      .nav { font-size: 14px; letter-spacing: 0.03em; }
      .meta { font-size: 13px; letter-spacing: 0.10em; text-transform: uppercase; }
      .small { font-size: 13px; }
      .body { font-size: 16px; }
      .title { font-size: 52px; }
      .section { font-size: 28px; }
      .chart-title { font-size: 34px; }
    </style>

    <radialGradient id="ground" cx="50%" cy="12%" r="90%">
      <stop offset="0%" stop-color="#fbfaf5"/>
      <stop offset="58%" stop-color="#f3f0e8"/>
      <stop offset="100%" stop-color="#e9e4d8"/>
    </radialGradient>

    <filter id="chartLift" x="-8%" y="-8%" width="116%" height="116%">
      <feDropShadow dx="0" dy="9" stdDeviation="18" flood-color="#1b1812" flood-opacity="0.055"/>
    </filter>
  </defs>

  <rect width="1440" height="2040" fill="url(#ground)"/>

